<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320">
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="22" font-size="14" fill="#333" font-weight="bold" text-anchor="middle">8-camera composite — what the VLM actually sees per clip</text>

  <!-- Row 1: forward / side cameras (blue tint) -->
  <!-- FRONT_LEFT -->
  <rect x="30" y="50" width="140" height="85" rx="4" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="1.5"/>
  <text x="100" y="68" font-size="10" fill="#666" text-anchor="middle">FRONT_LEFT</text>
  <line x1="50" y1="105" x2="150" y2="105" stroke="#3498db" stroke-width="1.5"/>
  <line x1="60" y1="120" x2="140" y2="95" stroke="#3498db" stroke-width="1" stroke-opacity="0.6"/>

  <!-- FRONT (with cyclist appearing here at end of trajectory) -->
  <rect x="180" y="50" width="140" height="85" rx="4" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="1.5"/>
  <text x="250" y="68" font-size="10" fill="#666" text-anchor="middle">FRONT</text>
  <line x1="200" y1="105" x2="300" y2="105" stroke="#3498db" stroke-width="1.5"/>
  <line x1="250" y1="80" x2="250" y2="125" stroke="#3498db" stroke-width="1" stroke-opacity="0.6"/>
  <!-- cyclist arriving in FRONT -->
  <circle cx="245" cy="118" r="4" fill="#e74c3c"/>

  <!-- FRONT_RIGHT -->
  <rect x="330" y="50" width="140" height="85" rx="4" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="1.5"/>
  <text x="400" y="68" font-size="10" fill="#666" text-anchor="middle">FRONT_RIGHT</text>
  <line x1="350" y1="105" x2="450" y2="105" stroke="#3498db" stroke-width="1.5"/>
  <line x1="360" y1="95" x2="440" y2="120" stroke="#3498db" stroke-width="1" stroke-opacity="0.6"/>

  <!-- SIDE_LEFT -->
  <rect x="480" y="50" width="140" height="85" rx="4" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="1.5"/>
  <text x="550" y="68" font-size="10" fill="#666" text-anchor="middle">SIDE_LEFT</text>
  <line x1="495" y1="115" x2="605" y2="100" stroke="#3498db" stroke-width="1.5"/>

  <!-- Ego vehicle between rows -->
  <rect x="305" y="148" width="90" height="22" rx="4" fill="#1abc9c" fill-opacity="0.18" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="350" y="163" font-size="10" fill="#1abc9c" text-anchor="middle" font-weight="bold">ego vehicle</text>

  <!-- FoV arrows from ego -->
  <line x1="320" y1="148" x2="280" y2="138" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="380" y1="170" x2="430" y2="195" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="270" y="148" font-size="9" fill="#666" text-anchor="end">FoV fwd</text>
  <text x="438" y="195" font-size="9" fill="#666">FoV rear</text>

  <!-- Row 2: SIDE_RIGHT, CAM_6, CAM_7, CAM_8 -->
  <!-- SIDE_RIGHT -->
  <rect x="30" y="185" width="140" height="85" rx="4" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="1.5"/>
  <text x="100" y="203" font-size="10" fill="#666" text-anchor="middle">SIDE_RIGHT</text>
  <line x1="40" y1="230" x2="160" y2="245" stroke="#3498db" stroke-width="1.5"/>

  <!-- CAM_6 (mixed / undefined — keep blue tint) -->
  <rect x="180" y="185" width="140" height="85" rx="4" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="1.5"/>
  <text x="250" y="203" font-size="10" fill="#666" text-anchor="middle">CAM_6</text>
  <line x1="195" y1="240" x2="305" y2="225" stroke="#3498db" stroke-width="1.5"/>

  <!-- CAM_7 (rear-facing, RED) -->
  <rect x="330" y="185" width="140" height="85" rx="4" fill="#e74c3c" fill-opacity="0.10" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="400" y="203" font-size="10" fill="#e74c3c" text-anchor="middle" font-weight="bold">CAM_7</text>
  <text x="400" y="216" font-size="9" fill="#e74c3c" text-anchor="middle">rear-facing</text>
  <!-- cyclist at start of trajectory (rear-most in CAM_7) -->
  <circle cx="365" cy="248" r="4" fill="#e74c3c"/>

  <!-- CAM_8 (rear-facing, RED) -->
  <rect x="480" y="185" width="140" height="85" rx="4" fill="#e74c3c" fill-opacity="0.10" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="550" y="203" font-size="10" fill="#e74c3c" text-anchor="middle" font-weight="bold">CAM_8</text>
  <text x="550" y="216" font-size="9" fill="#e74c3c" text-anchor="middle">rear-facing</text>
  <!-- cyclist mid-trajectory in CAM_8 -->
  <circle cx="525" cy="240" r="4" fill="#e74c3c"/>

  <!-- Cyclist trajectory dashed arrow: CAM_7 -> CAM_8 -> FRONT -->
  <path d="M 370 248 Q 450 270 525 240" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M 525 235 Q 400 150 250 120" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Bottom note -->
  <rect x="80" y="282" width="540" height="32" rx="6" fill="#f5f5f5" stroke="#333"/>
  <text x="350" y="302" font-size="10" fill="#333" text-anchor="middle">Front-only judging would miss cyclists that approach from behind — the label is sequence-level + sensor-suite-level, not front-cam-level.</text>
</svg>
