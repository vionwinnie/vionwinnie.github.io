<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320">
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="22" font-size="14" fill="#333" font-weight="bold" text-anchor="middle">VLM as a triage router for human raters</text>

  <!-- Stage 1: Incoming clip stream (blue) — far left -->
  <rect x="20" y="115" width="150" height="80" rx="4" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="1.5"/>
  <text x="95" y="138" font-size="11" fill="#3498db" text-anchor="middle" font-weight="bold">Incoming clip stream</text>
  <text x="95" y="158" font-size="10" fill="#666" text-anchor="middle">e.g. 10,000 / day</text>
  <text x="95" y="178" font-size="9" fill="#666" text-anchor="middle">composite videos</text>

  <!-- Arrow → Center -->
  <line x1="172" y1="155" x2="215" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: 3 VLM judges (orange) — center -->
  <rect x="220" y="110" width="170" height="90" rx="4" fill="#e67e22" fill-opacity="0.12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="305" y="132" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="bold">3 VLM judges</text>
  <text x="305" y="152" font-size="10" fill="#666" text-anchor="middle">→ per-clip H(p)</text>
  <text x="305" y="168" font-size="10" fill="#666" text-anchor="middle">→ per-clip predictions</text>
  <text x="305" y="187" font-size="9" fill="#666" text-anchor="middle">cross-judge agreement</text>

  <!-- Calibration note next to center box -->
  <rect x="220" y="210" width="280" height="50" rx="4" fill="#9b59b6" fill-opacity="0.08" stroke="#9b59b6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="360" y="226" font-size="9" fill="#666" text-anchor="middle">Per our results: only Cosmos's H(p) is usable as</text>
  <text x="360" y="238" font-size="9" fill="#666" text-anchor="middle">a confidence signal — VL is overconfident,</text>
  <text x="360" y="250" font-size="9" fill="#666" text-anchor="middle">Molmo is anti-informative. Per-judge calibration gating required.</text>

  <!-- Diverging arrows from center to 3 outcome boxes -->
  <!-- top: auto-bin (green) -->
  <line x1="392" y1="125" x2="475" y2="65" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- middle: human review (orange) -->
  <line x1="392" y1="155" x2="475" y2="155" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- bottom: novel-scenario (purple) -->
  <line x1="392" y1="185" x2="475" y2="245" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Outcome 1: Auto-bin (green, top right) -->
  <rect x="478" y="40" width="210" height="55" rx="4" fill="#27ae60" fill-opacity="0.12" stroke="#27ae60" stroke-width="1.5"/>
  <text x="583" y="58" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="bold">Auto-bin</text>
  <text x="583" y="73" font-size="9" fill="#666" text-anchor="middle">low H(p) AND all 3 judges agree</text>
  <text x="583" y="87" font-size="9" fill="#666" text-anchor="middle">≈ majority of clips → batched accept</text>

  <!-- Outcome 2: Human review (orange, middle right) -->
  <rect x="478" y="128" width="210" height="55" rx="4" fill="#e67e22" fill-opacity="0.12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="583" y="146" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="bold">Human review</text>
  <text x="583" y="161" font-size="9" fill="#666" text-anchor="middle">high H(p) OR judges disagree</text>
  <text x="583" y="175" font-size="9" fill="#666" text-anchor="middle">ambiguous / boundary — send to raters</text>

  <!-- Outcome 3: Novel-scenario candidate (purple, bottom right) -->
  <rect x="478" y="218" width="210" height="55" rx="4" fill="#9b59b6" fill-opacity="0.12" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="583" y="236" font-size="11" fill="#9b59b6" text-anchor="middle" font-weight="bold">Novel-scenario candidate</text>
  <text x="583" y="251" font-size="9" fill="#666" text-anchor="middle">high H(p) AND uniform-ish p̄ AND no judge confident</text>
  <text x="583" y="265" font-size="9" fill="#666" text-anchor="middle">potentially out-of-taxonomy — flag for taxonomy review</text>

  <!-- Bottom note -->
  <rect x="80" y="282" width="540" height="32" rx="6" fill="#f5f5f5" stroke="#333"/>
  <text x="350" y="302" font-size="10" fill="#333" text-anchor="middle">VLM is a router that decides which clips deserve human time — not a replacement for the human.</text>
</svg>
