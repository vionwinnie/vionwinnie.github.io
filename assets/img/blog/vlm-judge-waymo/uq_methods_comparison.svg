  <!-- Bottom note -->
  <rect x="80" y="313" width="540" height="38" rx="6" fill="#f5f5f5" stroke="#333"/>
  <text x="350" y="336" font-size="10" fill="#333" text-anchor="middle">Sample-and-count can't separate AU from EU when each trial is one-hot. Single-pass logits give a real per-clip distribution from one forward pass.</text>
