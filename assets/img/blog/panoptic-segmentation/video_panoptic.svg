<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320">
  <!-- Title -->
  <text x="350" y="22" font-size="14" fill="#333" font-weight="bold" text-anchor="middle">Video Panoptic Segmentation: Tracking Segments Across Frames</text>

  <defs>
    <marker id="arrow5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
    <marker id="arrow5-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#e67e22" stroke-width="1.2"/>
    </marker>
    <marker id="arrow5-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#9b59b6" stroke-width="1.2"/>
    </marker>
    <marker id="arrow5-teal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#1abc9c" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Frame t -->
  <text x="130" y="50" font-size="11" fill="#666" text-anchor="middle">Frame t</text>
  <rect x="40" y="58" width="180" height="120" rx="4" fill="white" stroke="#999" stroke-width="1"/>
  <!-- Road stuff -->
  <rect x="40" y="140" width="180" height="38" fill="#bdc3c7" opacity="0.3"/>
  <text x="130" y="163" font-size="8" fill="#666" text-anchor="middle">road</text>
  <!-- Person 1 -->
  <circle cx="85" cy="105" r="16" fill="#e67e22" opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
  <text x="85" y="108" font-size="8" fill="#e67e22" text-anchor="middle">P #1</text>
  <!-- Car 1 -->
  <rect x="140" y="95" width="45" height="28" rx="3" fill="#1abc9c" opacity="0.2" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="162" y="113" font-size="8" fill="#1abc9c" text-anchor="middle">C #1</text>

  <!-- Frame t+1 -->
  <text x="410" y="50" font-size="11" fill="#666" text-anchor="middle">Frame t+1</text>
  <rect x="320" y="58" width="180" height="120" rx="4" fill="white" stroke="#999" stroke-width="1"/>
  <!-- Road stuff -->
  <rect x="320" y="140" width="180" height="38" fill="#bdc3c7" opacity="0.3"/>
  <text x="410" y="163" font-size="8" fill="#666" text-anchor="middle">road</text>
  <!-- Person 1 moved right -->
  <circle cx="385" cy="100" r="16" fill="#e67e22" opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
  <text x="385" y="103" font-size="8" fill="#e67e22" text-anchor="middle">P #1</text>
  <!-- Car 1 moved right -->
  <rect x="420" y="90" width="45" height="28" rx="3" fill="#1abc9c" opacity="0.2" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="442" y="108" font-size="8" fill="#1abc9c" text-anchor="middle">C #1</text>
  <!-- New person appeared -->
  <circle cx="345" cy="115" r="12" fill="#9b59b6" opacity="0.2" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="345" y="118" font-size="8" fill="#9b59b6" text-anchor="middle">P #2</text>

  <!-- Tracking arrows between frames -->
  <line x1="101" y1="105" x2="369" y2="100" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow5-orange)"/>
  <text x="235" y="96" font-size="8" fill="#e67e22" text-anchor="middle">same ID tracked</text>

  <line x1="185" y1="109" x2="420" y2="104" stroke="#1abc9c" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow5-teal)"/>
  <text x="302" y="116" font-size="8" fill="#1abc9c" text-anchor="middle">same ID tracked</text>

  <!-- New ID annotation -->
  <line x1="345" y1="130" x2="345" y2="145" stroke="#9b59b6" stroke-width="1"/>
  <text x="345" y="155" font-size="8" fill="#9b59b6" text-anchor="middle">new ID assigned</text>

  <!-- Metric box -->
  <rect x="550" y="65" width="130" height="100" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="615" y="85" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">VPQ Metric</text>
  <text x="615" y="102" font-size="8" fill="#666" text-anchor="middle">Extends PQ to video:</text>
  <text x="615" y="118" font-size="8" fill="#666" text-anchor="middle">match tube IoU</text>
  <text x="615" y="132" font-size="8" fill="#666" text-anchor="middle">across k frames,</text>
  <text x="615" y="146" font-size="8" fill="#666" text-anchor="middle">penalize ID switches</text>

  <!-- Requirements list -->
  <text x="350" y="205" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">Video PS = Panoptic Segmentation + Temporal Consistency</text>
  <text x="350" y="222" font-size="9" fill="#666" text-anchor="middle">1. Segment every pixel in every frame (stuff + things)</text>
  <text x="350" y="237" font-size="9" fill="#666" text-anchor="middle">2. Maintain consistent instance IDs across the entire video</text>
  <text x="350" y="252" font-size="9" fill="#666" text-anchor="middle">3. Handle objects entering, leaving, and being occluded</text>

  <!-- Bottom note -->
  <rect x="100" y="268" width="500" height="35" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="350" y="284" fill="#333" font-size="10" text-anchor="middle">Video panoptic segmentation adds a temporal dimension: the model must not only</text>
  <text x="350" y="297" fill="#333" font-size="10" text-anchor="middle">label every pixel but also track each instance's identity across time.</text>
</svg>