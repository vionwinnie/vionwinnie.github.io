<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300">
  <!-- Title -->
  <text x="350" y="22" font-size="14" fill="#333" font-weight="bold" text-anchor="middle">The Panoptic Segmentation Output Format</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Panoptic map (center) -->
  <rect x="170" y="40" width="360" height="170" rx="4" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="58" font-size="11" fill="#333" font-weight="bold" text-anchor="middle">Panoptic Map: every pixel = (class_id, instance_id)</text>

  <!-- Sky - stuff -->
  <rect x="175" y="65" width="350" height="35" rx="0" fill="#aed6f1" opacity="0.35"/>
  <text x="350" y="87" font-size="9" fill="#3498db" text-anchor="middle">sky (stuff, class=0, id=0)</text>

  <!-- Road - stuff -->
  <rect x="175" y="155" width="350" height="50" rx="0" fill="#bdc3c7" opacity="0.35"/>
  <text x="350" y="183" font-size="9" fill="#666" text-anchor="middle">road (stuff, class=1, id=0)</text>

  <!-- Person 1 - thing -->
  <circle cx="250" cy="125" r="18" fill="#e67e22" opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
  <text x="250" y="122" font-size="8" fill="#e67e22" text-anchor="middle">person</text>
  <text x="250" y="132" font-size="8" fill="#e67e22" text-anchor="middle">c=2, id=1</text>

  <!-- Person 2 - thing -->
  <circle cx="320" cy="130" r="14" fill="#9b59b6" opacity="0.2" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="320" y="128" font-size="8" fill="#9b59b6" text-anchor="middle">person</text>
  <text x="320" y="138" font-size="8" fill="#9b59b6" text-anchor="middle">c=2, id=2</text>

  <!-- Car - thing -->
  <rect x="390" y="110" width="55" height="35" rx="3" fill="#1abc9c" opacity="0.2" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="417" y="126" font-size="8" fill="#1abc9c" text-anchor="middle">car</text>
  <text x="417" y="138" font-size="8" fill="#1abc9c" text-anchor="middle">c=3, id=1</text>

  <!-- Legend -->
  <rect x="555" y="70" width="130" height="80" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="620" y="88" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">Legend</text>
  <!-- Stuff -->
  <rect x="565" y="95" width="12" height="12" rx="2" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="1"/>
  <text x="585" y="105" font-size="9" fill="#666" text-anchor="start">Stuff (amorphous)</text>
  <!-- Thing -->
  <rect x="565" y="115" width="12" height="12" rx="2" fill="#e67e22" opacity="0.3" stroke="#e67e22" stroke-width="1"/>
  <text x="585" y="125" font-size="9" fill="#666" text-anchor="start">Things (countable)</text>
  <text x="620" y="143" font-size="8" fill="#999" text-anchor="middle">each thing has unique id</text>

  <!-- Encoding formula -->
  <text x="350" y="232" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">Encoding: panoptic_id = class_id * OFFSET + instance_id</text>
  <text x="350" y="248" font-size="9" fill="#666" text-anchor="middle">Stuff classes always get instance_id = 0 (no individual instances to distinguish)</text>

  <!-- Bottom note -->
  <rect x="100" y="260" width="500" height="30" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="350" y="279" fill="#333" font-size="10" text-anchor="middle">A single panoptic map assigns every pixel exactly one (class, instance) pair -- no gaps, no overlaps.</text>
</svg>