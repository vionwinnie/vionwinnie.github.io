<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320">
  <!-- Title -->
  <text x="350" y="22" font-size="14" fill="#333" font-weight="bold" text-anchor="middle">Semantic Segmentation vs Instance Segmentation</text>

  <!-- Arrowhead defs -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Input image (left) -->
  <text x="110" y="52" font-size="11" fill="#666" text-anchor="middle">Input Scene</text>
  <rect x="30" y="60" width="160" height="120" rx="4" fill="#ecf0f1" stroke="#999" stroke-width="1"/>
  <!-- Road -->
  <rect x="30" y="140" width="160" height="40" rx="0" fill="#bdc3c7" opacity="0.5"/>
  <text x="110" y="164" font-size="9" fill="#666" text-anchor="middle">road</text>
  <!-- Sky -->
  <rect x="30" y="60" width="160" height="40" rx="0" fill="#aed6f1" opacity="0.4"/>
  <text x="110" y="84" font-size="9" fill="#666" text-anchor="middle">sky</text>
  <!-- Person 1 -->
  <circle cx="70" cy="120" r="10" fill="#e74c3c" opacity="0.3" stroke="#e74c3c" stroke-width="1"/>
  <text x="70" y="124" font-size="7" fill="#e74c3c" text-anchor="middle">P</text>
  <!-- Person 2 -->
  <circle cx="100" cy="125" r="8" fill="#e74c3c" opacity="0.3" stroke="#e74c3c" stroke-width="1"/>
  <text x="100" y="128" font-size="7" fill="#e74c3c" text-anchor="middle">P</text>
  <!-- Car -->
  <rect x="130" y="110" width="40" height="25" rx="3" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="1"/>
  <text x="150" y="126" font-size="7" fill="#3498db" text-anchor="middle">C</text>

  <!-- Arrow to Semantic -->
  <line x1="200" y1="100" x2="240" y2="70" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Arrow to Instance -->
  <line x1="200" y1="140" x2="240" y2="170" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Semantic segmentation (top-right) -->
  <text x="370" y="52" font-size="11" fill="#3498db" font-weight="bold" text-anchor="middle">Semantic Segmentation</text>
  <rect x="250" y="60" width="240" height="100" rx="4" fill="white" stroke="#3498db" stroke-width="1.5"/>
  <!-- All pixels labeled by class, no instance distinction -->
  <rect x="250" y="60" width="240" height="30" rx="0" fill="#aed6f1" opacity="0.4"/>
  <text x="370" y="80" font-size="9" fill="#3498db" text-anchor="middle">sky (class 0)</text>
  <rect x="250" y="120" width="240" height="40" rx="0" fill="#bdc3c7" opacity="0.4"/>
  <text x="370" y="144" font-size="9" fill="#666" text-anchor="middle">road (class 1)</text>
  <!-- Both persons same color - no distinction -->
  <circle cx="300" cy="105" r="10" fill="#e74c3c" opacity="0.3" stroke="#e74c3c" stroke-width="1"/>
  <circle cx="340" cy="108" r="8" fill="#e74c3c" opacity="0.3" stroke="#e74c3c" stroke-width="1"/>
  <text x="320" y="100" font-size="8" fill="#e74c3c" text-anchor="middle">person (class 2) -- same label</text>
  <rect x="380" y="96" width="40" height="22" rx="3" fill="#3498db" opacity="0.2" stroke="#3498db" stroke-width="1"/>
  <text x="400" y="110" font-size="8" fill="#3498db" text-anchor="middle">car</text>

  <!-- Instance segmentation (bottom-right) -->
  <text x="370" y="182" font-size="11" fill="#e67e22" font-weight="bold" text-anchor="middle">Instance Segmentation</text>
  <rect x="250" y="190" width="240" height="80" rx="4" fill="white" stroke="#e67e22" stroke-width="1.5"/>
  <!-- Only countable objects, each with unique ID -->
  <!-- Person 1 - orange -->
  <circle cx="300" cy="225" r="12" fill="#e67e22" opacity="0.25" stroke="#e67e22" stroke-width="1.5"/>
  <text x="300" y="229" font-size="8" fill="#e67e22" text-anchor="middle">P #1</text>
  <!-- Person 2 - purple -->
  <circle cx="345" cy="228" r="10" fill="#9b59b6" opacity="0.25" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="345" y="232" font-size="8" fill="#9b59b6" text-anchor="middle">P #2</text>
  <!-- Car 1 -->
  <rect x="390" y="215" width="40" height="22" rx="3" fill="#1abc9c" opacity="0.25" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="410" y="230" font-size="8" fill="#1abc9c" text-anchor="middle">C #1</text>
  <!-- No road or sky -->
  <text x="275" y="210" font-size="8" fill="#999" text-anchor="start">no sky/road labels</text>

  <!-- Annotations -->
  <text x="560" y="100" font-size="9" fill="#3498db" text-anchor="start">Every pixel gets a</text>
  <text x="560" y="112" font-size="9" fill="#3498db" text-anchor="start">class label, but no</text>
  <text x="560" y="124" font-size="9" fill="#3498db" text-anchor="start">instance IDs</text>

  <text x="560" y="220" font-size="9" fill="#e67e22" text-anchor="start">Each object gets a</text>
  <text x="560" y="232" font-size="9" fill="#e67e22" text-anchor="start">unique mask + ID, but</text>
  <text x="560" y="244" font-size="9" fill="#e67e22" text-anchor="start">background is ignored</text>

  <!-- Bottom note -->
  <rect x="100" y="283" width="500" height="30" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="350" y="302" fill="#333" font-size="10" text-anchor="middle">Neither task alone gives a complete scene understanding -- panoptic segmentation unifies both.</text>
</svg>