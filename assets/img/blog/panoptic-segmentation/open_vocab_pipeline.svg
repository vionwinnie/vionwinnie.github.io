<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310">
  <!-- Title -->
  <text x="350" y="22" font-size="14" fill="#333" font-weight="bold" text-anchor="middle">Open-Vocabulary Panoptic Segmentation</text>

  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
    <marker id="arrow4-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#9b59b6" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Closed vocab (top) -->
  <text x="175" y="50" font-size="11" fill="#e74c3c" font-weight="bold" text-anchor="middle">Closed-Vocabulary</text>
  <rect x="30" y="60" width="290" height="90" rx="4" fill="white" stroke="#e74c3c" stroke-width="1" stroke-dasharray="5,3"/>

  <rect x="45" y="75" width="80" height="28" rx="4" fill="#3498db" opacity="0.1" stroke="#3498db" stroke-width="1"/>
  <text x="85" y="93" font-size="9" fill="#3498db" text-anchor="middle">Image</text>
  <line x1="125" y1="89" x2="145" y2="89" stroke="#555" stroke-width="1" marker-end="url(#arrow4)"/>
  <rect x="150" y="75" width="80" height="28" rx="4" fill="#e67e22" opacity="0.1" stroke="#e67e22" stroke-width="1"/>
  <text x="190" y="93" font-size="9" fill="#e67e22" text-anchor="middle">Model</text>
  <line x1="230" y1="89" x2="250" y2="89" stroke="#555" stroke-width="1" marker-end="url(#arrow4)"/>

  <!-- Fixed class list -->
  <rect x="255" y="70" width="55" height="40" rx="4" fill="#e74c3c" opacity="0.1" stroke="#e74c3c" stroke-width="1"/>
  <text x="282" y="85" font-size="7" fill="#e74c3c" text-anchor="middle">car</text>
  <text x="282" y="95" font-size="7" fill="#e74c3c" text-anchor="middle">person</text>
  <text x="282" y="105" font-size="7" fill="#e74c3c" text-anchor="middle">road</text>

  <text x="175" y="140" font-size="8" fill="#999" text-anchor="middle">Fixed set of N classes defined at training time</text>

  <!-- Open vocab (bottom) -->
  <text x="525" y="50" font-size="11" fill="#9b59b6" font-weight="bold" text-anchor="middle">Open-Vocabulary</text>
  <rect x="380" y="60" width="290" height="130" rx="4" fill="white" stroke="#9b59b6" stroke-width="1.5"/>

  <!-- Image encoder -->
  <rect x="395" y="80" width="70" height="28" rx="4" fill="#3498db" opacity="0.1" stroke="#3498db" stroke-width="1"/>
  <text x="430" y="98" font-size="9" fill="#3498db" text-anchor="middle">Image</text>

  <!-- Text encoder -->
  <rect x="395" y="130" width="70" height="28" rx="4" fill="#9b59b6" opacity="0.1" stroke="#9b59b6" stroke-width="1"/>
  <text x="430" y="142" font-size="8" fill="#9b59b6" text-anchor="middle">"skateboard"</text>
  <text x="430" y="153" font-size="8" fill="#9b59b6" text-anchor="middle">(any text)</text>

  <!-- CLIP embedding space -->
  <line x1="465" y1="94" x2="495" y2="110" stroke="#3498db" stroke-width="1" marker-end="url(#arrow4)"/>
  <line x1="465" y1="144" x2="495" y2="128" stroke="#9b59b6" stroke-width="1" marker-end="url(#arrow4-purple)"/>

  <rect x="498" y="100" width="75" height="35" rx="4" fill="#1abc9c" opacity="0.12" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="536" y="116" font-size="8" fill="#1abc9c" text-anchor="middle">Shared</text>
  <text x="536" y="128" font-size="8" fill="#1abc9c" text-anchor="middle">CLIP space</text>

  <line x1="573" y1="117" x2="595" y2="117" stroke="#555" stroke-width="1" marker-end="url(#arrow4)"/>

  <!-- Output -->
  <rect x="600" y="100" width="55" height="35" rx="4" fill="#27ae60" opacity="0.1" stroke="#27ae60" stroke-width="1"/>
  <text x="627" y="116" font-size="8" fill="#27ae60" text-anchor="middle">Masks for</text>
  <text x="627" y="128" font-size="8" fill="#27ae60" text-anchor="middle">any class</text>

  <text x="525" y="180" font-size="8" fill="#999" text-anchor="middle">Text encoder maps arbitrary class names to the same</text>
  <text x="525" y="192" font-size="8" fill="#999" text-anchor="middle">embedding space as visual features</text>

  <!-- Big comparison arrow -->
  <text x="350" y="220" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">Key difference</text>
  <text x="350" y="236" font-size="9" fill="#666" text-anchor="middle">Closed-vocab: classification head with N fixed neurons</text>
  <text x="350" y="250" font-size="9" fill="#666" text-anchor="middle">Open-vocab: dot product between mask embedding and text embedding</text>

  <!-- Bottom note -->
  <rect x="100" y="265" width="500" height="35" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="350" y="281" fill="#333" font-size="10" text-anchor="middle">Vision-language alignment (e.g., CLIP) replaces fixed classifiers,</text>
  <text x="350" y="294" fill="#333" font-size="10" text-anchor="middle">enabling recognition of categories never seen during segmentation training.</text>
</svg>