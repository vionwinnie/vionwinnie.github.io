<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350">
  <!-- Title -->
  <text x="350" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">SAM 2 Memory Mechanism: How Video Tracking Works</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
    <marker id="ar-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#e74c3c" stroke-width="1"/>
    </marker>
  </defs>

  <!-- ====== Timeline of frames ====== -->
  <text x="60" y="50" fill="#666" font-size="10" font-weight="bold">Video frames over time:</text>

  <!-- Frame t-3 (prompted) -->
  <rect x="40" y="60" width="70" height="55" rx="4" fill="#e67e22" fill-opacity="0.12" stroke="#e67e22" stroke-width="2"/>
  <text x="75" y="82" fill="#e67e22" font-size="9" font-weight="bold" text-anchor="middle">Frame t-3</text>
  <text x="75" y="96" fill="#e67e22" font-size="8" text-anchor="middle">USER CLICK</text>
  <text x="75" y="106" fill="#666" font-size="8" text-anchor="middle">prompted</text>

  <!-- Frame t-2 -->
  <rect x="130" y="60" width="70" height="55" rx="4" fill="#3498db" fill-opacity="0.08" stroke="#3498db" stroke-width="1"/>
  <text x="165" y="82" fill="#3498db" font-size="9" text-anchor="middle">Frame t-2</text>
  <text x="165" y="96" fill="#666" font-size="8" text-anchor="middle">propagated</text>

  <!-- Frame t-1 -->
  <rect x="220" y="60" width="70" height="55" rx="4" fill="#3498db" fill-opacity="0.08" stroke="#3498db" stroke-width="1"/>
  <text x="255" y="82" fill="#3498db" font-size="9" text-anchor="middle">Frame t-1</text>
  <text x="255" y="96" fill="#666" font-size="8" text-anchor="middle">propagated</text>

  <!-- Frame t (current) -->
  <rect x="310" y="60" width="70" height="55" rx="4" fill="#e74c3c" fill-opacity="0.12" stroke="#e74c3c" stroke-width="2"/>
  <text x="345" y="82" fill="#e74c3c" font-size="9" font-weight="bold" text-anchor="middle">Frame t</text>
  <text x="345" y="96" fill="#e74c3c" font-size="8" text-anchor="middle">CURRENT</text>

  <!-- Propagation arrows -->
  <line x1="110" y1="87" x2="128" y2="87" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="200" y1="87" x2="218" y2="87" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="290" y1="87" x2="308" y2="87" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>

  <!-- ====== Memory encoding process ====== -->
  <text x="450" y="50" fill="#9b59b6" font-size="10" font-weight="bold">Memory encoding per frame:</text>

  <!-- Step 1: image features -->
  <rect x="430" y="62" width="120" height="22" rx="4" fill="#3498db" fill-opacity="0.08" stroke="#3498db" stroke-width="1"/>
  <text x="490" y="77" fill="#3498db" font-size="9" text-anchor="middle">Image features (from Hiera)</text>

  <!-- + -->
  <text x="490" y="95" fill="#333" font-size="11" text-anchor="middle">+</text>

  <!-- Step 2: predicted mask -->
  <rect x="430" y="100" width="120" height="22" rx="4" fill="#27ae60" fill-opacity="0.08" stroke="#27ae60" stroke-width="1"/>
  <text x="490" y="115" fill="#27ae60" font-size="9" text-anchor="middle">Predicted mask (decoder)</text>

  <!-- Arrow down -->
  <line x1="490" y1="122" x2="490" y2="140" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>

  <!-- Memory encoder conv -->
  <rect x="440" y="142" width="100" height="24" rx="4" fill="#e74c3c" fill-opacity="0.08" stroke="#e74c3c" stroke-width="1"/>
  <text x="490" y="158" fill="#e74c3c" font-size="9" text-anchor="middle">Conv downscale</text>

  <!-- Arrow to memory -->
  <line x1="490" y1="166" x2="490" y2="185" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>

  <!-- Spatial memory -->
  <rect x="430" y="187" width="130" height="22" rx="4" fill="#9b59b6" fill-opacity="0.1" stroke="#9b59b6" stroke-width="1"/>
  <text x="495" y="202" fill="#9b59b6" font-size="9" text-anchor="middle">Spatial memory (64x64 feats)</text>

  <!-- ====== Memory Attention Detail ====== -->
  <rect x="40" y="140" width="350" height="140" rx="4" fill="#9b59b6" fill-opacity="0.04" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="215" y="160" fill="#9b59b6" font-size="11" font-weight="bold" text-anchor="middle">Memory Attention (for current frame t)</text>

  <!-- Self attention -->
  <rect x="60" y="170" width="140" height="35" rx="4" fill="#3498db" fill-opacity="0.08" stroke="#3498db" stroke-width="1"/>
  <text x="130" y="185" fill="#3498db" font-size="9" font-weight="bold" text-anchor="middle">Self-Attention</text>
  <text x="130" y="197" fill="#666" font-size="8" text-anchor="middle">Q=K=V = current frame features</text>

  <!-- Arrow down -->
  <line x1="130" y1="205" x2="130" y2="218" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>

  <!-- Cross attention -->
  <rect x="60" y="220" width="140" height="45" rx="4" fill="#9b59b6" fill-opacity="0.08" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="130" y="237" fill="#9b59b6" font-size="9" font-weight="bold" text-anchor="middle">Cross-Attention</text>
  <text x="130" y="250" fill="#666" font-size="8" text-anchor="middle">Q = current features</text>
  <text x="130" y="261" fill="#666" font-size="8" text-anchor="middle">K, V = memory bank</text>

  <!-- Memory bank arrow into cross attention -->
  <line x1="430" y1="210" x2="200" y2="245" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ar)"/>

  <!-- Output arrow -->
  <rect x="230" y="222" width="140" height="35" rx="4" fill="#27ae60" fill-opacity="0.08" stroke="#27ae60" stroke-width="1"/>
  <text x="300" y="237" fill="#27ae60" font-size="9" font-weight="bold" text-anchor="middle">Memory-conditioned</text>
  <text x="300" y="250" fill="#666" font-size="8" text-anchor="middle">features for frame t</text>

  <!-- Bottom note box -->
  <rect x="80" y="300" width="540" height="36" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="350" y="315" fill="#333" font-size="10" text-anchor="middle">Cross-attention lets the current frame "look back" at past frames' spatial features and masks,</text>
  <text x="350" y="328" fill="#333" font-size="10" text-anchor="middle">enabling object tracking without explicit motion estimation or optical flow computation.</text>
</svg>