<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380">
  <!-- Title -->
  <text x="350" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">SAM 2: Streaming Architecture for Video Segmentation</text>

  <!-- Arrowhead definitions -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#9b59b6" stroke-width="1"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#1abc9c" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Frame t label -->
  <text x="60" y="48" fill="#666" font-size="10">Frame t</text>

  <!-- Image Encoder -->
  <rect x="20" y="55" width="100" height="55" rx="4" fill="#3498db" fill-opacity="0.08" stroke="#3498db" stroke-width="1.5"/>
  <text x="70" y="76" fill="#3498db" font-size="10" font-weight="bold" text-anchor="middle">Image Encoder</text>
  <text x="70" y="90" fill="#666" font-size="9" text-anchor="middle">Hiera (MAE)</text>
  <text x="70" y="101" fill="#666" font-size="9" text-anchor="middle">hierarchical ViT</text>

  <!-- Arrow to Memory Attention -->
  <line x1="120" y1="82" x2="165" y2="82" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
  <text x="143" y="76" fill="#666" font-size="8" text-anchor="middle">feat.</text>

  <!-- Memory Attention block -->
  <rect x="173" y="45" width="130" height="75" rx="4" fill="#9b59b6" fill-opacity="0.08" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="238" y="65" fill="#9b59b6" font-size="10" font-weight="bold" text-anchor="middle">Memory Attention</text>
  <text x="238" y="80" fill="#666" font-size="9" text-anchor="middle">Stacked transformer</text>
  <text x="238" y="92" fill="#666" font-size="9" text-anchor="middle">Self-attn + Cross-attn</text>
  <text x="238" y="104" fill="#666" font-size="9" text-anchor="middle">to memory bank</text>

  <!-- Arrow to Prompt + Mask Decoder -->
  <line x1="303" y1="82" x2="345" y2="82" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Prompt Encoder + Mask Decoder -->
  <rect x="353" y="45" width="130" height="75" rx="4" fill="#27ae60" fill-opacity="0.08" stroke="#27ae60" stroke-width="1.5"/>
  <text x="418" y="62" fill="#27ae60" font-size="10" font-weight="bold" text-anchor="middle">Prompt Encoder</text>
  <text x="418" y="74" fill="#27ae60" font-size="10" font-weight="bold" text-anchor="middle">+ Mask Decoder</text>
  <text x="418" y="90" fill="#666" font-size="9" text-anchor="middle">(same design as SAM)</text>
  <text x="418" y="102" fill="#666" font-size="9" text-anchor="middle">optional prompt input</text>

  <!-- Arrow to output -->
  <line x1="483" y1="82" x2="525" y2="82" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Output mask for frame t -->
  <rect x="533" y="55" width="80" height="55" rx="4" fill="#27ae60" fill-opacity="0.1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="573" y="78" fill="#27ae60" font-size="10" font-weight="bold" text-anchor="middle">Mask_t</text>
  <text x="573" y="93" fill="#666" font-size="9" text-anchor="middle">+ IoU score</text>

  <!-- ====== MEMORY BANK (below) ====== -->
  <rect x="100" y="170" width="440" height="110" rx="4" fill="#1abc9c" fill-opacity="0.06" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="320" y="190" fill="#1abc9c" font-size="11" font-weight="bold" text-anchor="middle">Memory Bank</text>

  <!-- Recent memories -->
  <rect x="120" y="200" width="120" height="55" rx="4" fill="#3498db" fill-opacity="0.08" stroke="#3498db" stroke-width="1"/>
  <text x="180" y="218" fill="#3498db" font-size="9" font-weight="bold" text-anchor="middle">Recent Memories</text>
  <text x="180" y="232" fill="#666" font-size="8" text-anchor="middle">Last N frames (FIFO)</text>
  <text x="180" y="244" fill="#666" font-size="8" text-anchor="middle">spatial feat + mask</text>

  <!-- Prompted memories -->
  <rect x="260" y="200" width="120" height="55" rx="4" fill="#e67e22" fill-opacity="0.08" stroke="#e67e22" stroke-width="1"/>
  <text x="320" y="218" fill="#e67e22" font-size="9" font-weight="bold" text-anchor="middle">Prompted Memories</text>
  <text x="320" y="232" fill="#666" font-size="8" text-anchor="middle">User-corrected frames</text>
  <text x="320" y="244" fill="#666" font-size="8" text-anchor="middle">highest priority</text>

  <!-- Object pointers -->
  <rect x="400" y="200" width="120" height="55" rx="4" fill="#9b59b6" fill-opacity="0.08" stroke="#9b59b6" stroke-width="1"/>
  <text x="460" y="218" fill="#9b59b6" font-size="9" font-weight="bold" text-anchor="middle">Object Pointers</text>
  <text x="460" y="232" fill="#666" font-size="8" text-anchor="middle">Lightweight tokens</text>
  <text x="460" y="244" fill="#666" font-size="8" text-anchor="middle">from each past frame</text>

  <!-- Memory Encoder arrow (from output mask down to memory bank) -->
  <rect x="565" y="140" width="85" height="40" rx="4" fill="#e74c3c" fill-opacity="0.08" stroke="#e74c3c" stroke-width="1"/>
  <text x="608" y="157" fill="#e74c3c" font-size="9" font-weight="bold" text-anchor="middle">Memory</text>
  <text x="608" y="169" fill="#e74c3c" font-size="9" font-weight="bold" text-anchor="middle">Encoder</text>
  <line x1="573" y1="110" x2="608" y2="140" stroke="#e74c3c" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="565" y1="160" x2="540" y2="200" stroke="#1abc9c" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr-teal)"/>

  <!-- Arrow from memory bank up to memory attention -->
  <line x1="238" y1="170" x2="238" y2="120" stroke="#9b59b6" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="255" y="150" fill="#9b59b6" font-size="8">cross-attn keys/values</text>

  <!-- Streaming arrow -->
  <text x="350" y="308" fill="#e74c3c" font-size="10" font-weight="bold" text-anchor="middle">Streaming: process frame-by-frame, no future look-ahead</text>
  <line x1="100" y1="315" x2="600" y2="315" stroke="#e74c3c" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="120" y="328" fill="#666" font-size="9">t-N</text>
  <text x="250" y="328" fill="#666" font-size="9">t-2</text>
  <text x="350" y="328" fill="#666" font-size="9">t-1</text>
  <text x="480" y="328" fill="#e74c3c" font-size="9" font-weight="bold">t (current)</text>
  <text x="570" y="328" fill="#999" font-size="9">t+1 ...</text>

  <!-- Bottom note box -->
  <rect x="100" y="340" width="500" height="30" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="350" y="359" fill="#333" font-size="10" text-anchor="middle">Memory bank stores past context; memory attention conditions current frame on history -- enabling tracking without optical flow.</text>
</svg>