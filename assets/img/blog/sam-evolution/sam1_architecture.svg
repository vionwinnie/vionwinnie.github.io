<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320">
  <!-- Title -->
  <text x="350" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">SAM Architecture: Promptable Image Segmentation</text>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#3498db" stroke-width="1"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#e67e22" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Input Image -->
  <rect x="20" y="55" width="90" height="70" rx="4" fill="#3498db" fill-opacity="0.1" stroke="#3498db" stroke-width="1.5"/>
  <text x="65" y="85" fill="#3498db" font-size="11" text-anchor="middle">Input</text>
  <text x="65" y="100" fill="#3498db" font-size="11" text-anchor="middle">Image</text>

  <!-- Arrow to Image Encoder -->
  <line x1="110" y1="90" x2="140" y2="90" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Image Encoder (ViT) -->
  <rect x="148" y="45" width="120" height="90" rx="4" fill="#3498db" fill-opacity="0.08" stroke="#3498db" stroke-width="1.5"/>
  <text x="208" y="72" fill="#3498db" font-size="11" font-weight="bold" text-anchor="middle">Image Encoder</text>
  <text x="208" y="88" fill="#666" font-size="9" text-anchor="middle">ViT-H (MAE pretrained)</text>
  <text x="208" y="102" fill="#666" font-size="9" text-anchor="middle">Run once per image</text>
  <text x="208" y="116" fill="#666" font-size="9" text-anchor="middle">1024x1024 -> 64x64</text>

  <!-- Prompts -->
  <rect x="148" y="165" width="120" height="75" rx="4" fill="#e67e22" fill-opacity="0.08" stroke="#e67e22" stroke-width="1.5"/>
  <text x="208" y="188" fill="#e67e22" font-size="11" font-weight="bold" text-anchor="middle">Prompt Encoder</text>
  <text x="208" y="204" fill="#666" font-size="9" text-anchor="middle">Points / Boxes: positional</text>
  <text x="208" y="216" fill="#666" font-size="9" text-anchor="middle">Text: CLIP encoding</text>
  <text x="208" y="228" fill="#666" font-size="9" text-anchor="middle">Masks: conv downscale</text>

  <!-- Arrows from encoders to decoder -->
  <line x1="268" y1="90" x2="350" y2="115" stroke="#3498db" stroke-width="1" marker-end="url(#arrow-blue)"/>
  <line x1="268" y1="200" x2="350" y2="145" stroke="#e67e22" stroke-width="1" marker-end="url(#arrow-orange)"/>

  <!-- Mask Decoder -->
  <rect x="358" y="85" width="140" height="100" rx="4" fill="#27ae60" fill-opacity="0.08" stroke="#27ae60" stroke-width="1.5"/>
  <text x="428" y="108" fill="#27ae60" font-size="11" font-weight="bold" text-anchor="middle">Mask Decoder</text>
  <text x="428" y="126" fill="#666" font-size="9" text-anchor="middle">2-layer transformer</text>
  <text x="428" y="140" fill="#666" font-size="9" text-anchor="middle">Cross-attention:</text>
  <text x="428" y="152" fill="#666" font-size="9" text-anchor="middle">prompt tokens <-> image</text>
  <text x="428" y="166" fill="#666" font-size="9" text-anchor="middle">Output: 3 masks + IoU</text>

  <!-- Arrow to output -->
  <line x1="498" y1="135" x2="540" y2="135" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Output Masks -->
  <rect x="548" y="70" width="130" height="75" rx="4" fill="#27ae60" fill-opacity="0.1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="613" y="95" fill="#27ae60" font-size="11" font-weight="bold" text-anchor="middle">Output</text>
  <text x="613" y="112" fill="#666" font-size="9" text-anchor="middle">3 valid masks</text>
  <text x="613" y="125" fill="#666" font-size="9" text-anchor="middle">+ confidence (IoU) scores</text>

  <!-- Amortization note -->
  <rect x="148" y="43" width="8" height="8" rx="1" fill="#e74c3c" fill-opacity="0.8"/>
  <text x="162" y="50" fill="#e74c3c" font-size="8">Heavy (once)</text>
  <rect x="358" y="83" width="8" height="8" rx="1" fill="#27ae60" fill-opacity="0.8"/>
  <text x="372" y="90" fill="#27ae60" font-size="8">Light (per prompt)</text>

  <!-- Bottom note box -->
  <rect x="100" y="268" width="500" height="34" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="350" y="283" fill="#333" font-size="10" text-anchor="middle">Key insight: Heavy image encoder runs once; lightweight decoder runs per prompt,</text>
  <text x="350" y="295" fill="#333" font-size="10" text-anchor="middle">enabling real-time interactive segmentation at ~50ms per mask.</text>
</svg>