<svg xmlns="http://www.w3.org/2000/svg" width="620" height="200" font-family="sans-serif">
  <rect width="620" height="200" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#555"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Setpoint label -->
  <text x="18" y="72" font-size="11" fill="#333">Setpoint</text>
  <text x="22" y="85" font-size="11" fill="#333" font-style="italic">r(t)</text>

  <!-- Arrow to summing junction -->
  <line x1="60" y1="78" x2="82" y2="78" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Summing junction circle -->
  <circle cx="95" cy="78" r="12" fill="white" stroke="#555" stroke-width="1.5"/>
  <text x="95" y="82" text-anchor="middle" font-size="14" fill="#555">+</text>
  <text x="86" y="100" font-size="9" fill="#555">&#x2212;</text>

  <!-- Error signal -->
  <line x1="107" y1="78" x2="140" y2="78" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="118" y="70" font-size="10" fill="#e74c3c" font-style="italic">e(t)</text>

  <!-- PID Controller box -->
  <rect x="145" y="42" rx="8" ry="8" width="200" height="72" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="1.5"/>
  <text x="245" y="56" text-anchor="middle" font-size="12" fill="#3498db" font-weight="bold">PID Controller</text>

  <!-- Three parallel paths inside PID -->
  <rect x="158" y="62" rx="4" ry="4" width="55" height="20" fill="rgba(52,152,219,0.08)" stroke="#3498db" stroke-width="1"/>
  <text x="185" y="76" text-anchor="middle" font-size="9" fill="#3498db" font-weight="bold">P: Kp&#xb7;e</text>

  <rect x="218" y="62" rx="4" ry="4" width="55" height="20" fill="rgba(52,152,219,0.08)" stroke="#3498db" stroke-width="1"/>
  <text x="245" y="76" text-anchor="middle" font-size="9" fill="#3498db" font-weight="bold">I: Ki&#xb7;&#x222b;e</text>

  <rect x="278" y="62" rx="4" ry="4" width="55" height="20" fill="rgba(52,152,219,0.08)" stroke="#3498db" stroke-width="1"/>
  <text x="305" y="76" text-anchor="middle" font-size="9" fill="#3498db" font-weight="bold">D: Kd&#xb7;de/dt</text>

  <!-- P, I, D labels below -->
  <text x="185" y="102" text-anchor="middle" font-size="8" fill="#666">Proportional</text>
  <text x="245" y="102" text-anchor="middle" font-size="8" fill="#666">Integral</text>
  <text x="305" y="102" text-anchor="middle" font-size="8" fill="#666">Derivative</text>

  <!-- Arrow from PID to Plant -->
  <line x1="345" y1="78" x2="380" y2="78" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Plant/Robot box -->
  <rect x="385" y="55" rx="8" ry="8" width="110" height="46" fill="rgba(39,174,96,0.15)" stroke="#27ae60" stroke-width="1.5"/>
  <text x="440" y="82" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">Plant / Robot</text>

  <!-- Arrow to output -->
  <line x1="495" y1="78" x2="535" y2="78" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Output label -->
  <text x="547" y="72" font-size="11" fill="#333">Output</text>
  <text x="553" y="85" font-size="11" fill="#333" font-style="italic">y(t)</text>

  <!-- Feedback path -->
  <line x1="530" y1="78" x2="530" y2="140" stroke="#555" stroke-width="1.5"/>
  <line x1="530" y1="140" x2="95" y2="140" stroke="#555" stroke-width="1.5"/>
  <line x1="95" y1="140" x2="95" y2="92" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="310" y="153" text-anchor="middle" font-size="10" fill="#666">Feedback</text>

  <!-- Caption -->
  <text x="310" y="183" text-anchor="middle" font-size="10" fill="#666">PID control: proportional fights error, integral fights steady-state offset, derivative fights overshoot.</text>
</svg>