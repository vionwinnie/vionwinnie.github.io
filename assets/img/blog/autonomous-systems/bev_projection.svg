<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Left: Perspective camera view (trapezoid) -->
  <polygon points="40,50 170,30 170,160 40,140" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="2"/>
  <!-- Fake perspective lines inside trapezoid -->
  <line x1="60" y1="55" x2="160" y2="40" stroke="#3498db" stroke-width="0.5" opacity="0.4"/>
  <line x1="60" y1="135" x2="160" y2="150" stroke="#3498db" stroke-width="0.5" opacity="0.4"/>
  <line x1="105" y1="95" x2="105" y2="60" stroke="#3498db" stroke-width="0.5" opacity="0.4"/>
  <!-- Vanishing point hint -->
  <rect x="85" y="72" width="40" height="22" rx="3" fill="rgba(52,152,219,0.3)" stroke="#3498db" stroke-width="1"/>
  <rect x="70" y="100" width="30" height="18" rx="3" fill="rgba(39,174,96,0.3)" stroke="#27ae60" stroke-width="1"/>
  <text x="105" y="178" text-anchor="middle" font-size="11" fill="#3498db" font-weight="bold">Camera Image</text>
  <text x="105" y="193" text-anchor="middle" font-size="10" fill="#666">(Perspective)</text>

  <!-- Center arrow with label -->
  <line x1="185" y1="95" x2="370" y2="95" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="215" y="70" width="130" height="22" rx="6" fill="white" stroke="#f39c12" stroke-width="1.5"/>
  <text x="280" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#f39c12">Lift-Splat-Shoot</text>
  <text x="280" y="110" text-anchor="middle" font-size="9" fill="#666">depth prediction +</text>
  <text x="280" y="122" text-anchor="middle" font-size="9" fill="#666">feature scattering</text>

  <!-- Right: BEV grid (top-down rectangle) -->
  <rect x="385" y="30" width="150" height="140" rx="4" fill="rgba(39,174,96,0.08)" stroke="#27ae60" stroke-width="2"/>
  <!-- Grid lines -->
  <line x1="385" y1="65" x2="535" y2="65" stroke="#27ae60" stroke-width="0.5" opacity="0.3"/>
  <line x1="385" y1="100" x2="535" y2="100" stroke="#27ae60" stroke-width="0.5" opacity="0.3"/>
  <line x1="385" y1="135" x2="535" y2="135" stroke="#27ae60" stroke-width="0.5" opacity="0.3"/>
  <line x1="422" y1="30" x2="422" y2="170" stroke="#27ae60" stroke-width="0.5" opacity="0.3"/>
  <line x1="460" y1="30" x2="460" y2="170" stroke="#27ae60" stroke-width="0.5" opacity="0.3"/>
  <line x1="497" y1="30" x2="497" y2="170" stroke="#27ae60" stroke-width="0.5" opacity="0.3"/>
  <!-- Colored cells to show features -->
  <rect x="422" y="65" width="38" height="35" fill="rgba(52,152,219,0.25)"/>
  <rect x="460" y="65" width="37" height="35" fill="rgba(52,152,219,0.15)"/>
  <rect x="422" y="100" width="38" height="35" fill="rgba(231,76,60,0.2)"/>
  <rect x="460" y="100" width="37" height="35" fill="rgba(39,174,96,0.25)"/>
  <text x="460" y="188" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="bold">BEV Features</text>
  <text x="460" y="203" text-anchor="middle" font-size="10" fill="#666">(Top-down)</text>

  <!-- Below BEV: car icon with range circles -->
  <rect x="448" y="225" width="24" height="36" rx="5" fill="rgba(85,85,85,0.2)" stroke="#555" stroke-width="1.5"/>
  <text x="460" y="248" text-anchor="middle" font-size="8" fill="#555">EGO</text>
  <!-- Range circles -->
  <circle cx="460" cy="243" r="26" fill="none" stroke="#555" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="460" cy="243" r="44" fill="none" stroke="#555" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="460" cy="243" r="62" fill="none" stroke="#555" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Caption -->
  <text x="290" y="310" text-anchor="middle" font-size="11" fill="#666" font-style="italic">BEV representation unifies multi-camera views into a single scale-invariant coordinate frame.</text>
</svg>