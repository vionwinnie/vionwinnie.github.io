<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="sans-serif">
  <!-- Camera Image -->
  <rect x="250" y="10" width="140" height="45" rx="8" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="2"/>
  <text x="320" y="37" text-anchor="middle" fill="#3498db" font-size="12" font-weight="bold">Camera Image</text>
  <!-- Mini scene inside -->
  <line x1="265" y1="42" x2="315" y2="42" stroke="#3498db" stroke-width="1" opacity="0.5"/>
  <rect x="275" y="32" width="10" height="10" rx="1" fill="#3498db" fill-opacity="0.3" stroke="#3498db" stroke-width="0.5"/>
  <circle cx="300" cy="37" r="5" fill="#e74c3c" fill-opacity="0.3" stroke="#e74c3c" stroke-width="0.5"/>

  <!-- Arrow down -->
  <line x1="320" y1="55" x2="320" y2="72" stroke="#555" stroke-width="1.5"/>
  <polygon points="316,72 320,80 324,72" fill="#555"/>

  <!-- Vision Encoder -->
  <rect x="225" y="80" width="190" height="35" rx="8" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="2"/>
  <text x="320" y="102" text-anchor="middle" fill="#3498db" font-size="12" font-weight="bold">Vision Encoder (ViT/SigLIP)</text>

  <!-- Visual Tokens label -->
  <text x="440" y="102" fill="#3498db" font-size="10">→ Visual Tokens</text>

  <!-- Arrow down -->
  <line x1="320" y1="115" x2="320" y2="132" stroke="#555" stroke-width="1.5"/>
  <polygon points="316,132 320,140 324,132" fill="#555"/>

  <!-- Language Model (large box) -->
  <rect x="190" y="140" width="260" height="50" rx="8" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="2"/>
  <text x="320" y="162" text-anchor="middle" fill="#27ae60" font-size="13" font-weight="bold">Language Model (LLM)</text>
  <text x="320" y="178" text-anchor="middle" fill="#666" font-size="10">Fuses vision + language, reasons about task</text>

  <!-- Instruction input from left -->
  <rect x="10" y="145" width="155" height="38" rx="8" fill="#f39c12" fill-opacity="0.15" stroke="#f39c12" stroke-width="1.5"/>
  <text x="87" y="162" text-anchor="middle" fill="#f39c12" font-size="10" font-weight="bold">Instruction</text>
  <text x="87" y="175" text-anchor="middle" fill="#333" font-size="9">"Pick up the red cup"</text>
  <line x1="165" y1="165" x2="188" y2="165" stroke="#555" stroke-width="1.5"/>
  <polygon points="186,161 194,165 186,169" fill="#555"/>

  <!-- Arrow down from LLM -->
  <line x1="320" y1="190" x2="320" y2="207" stroke="#555" stroke-width="1.5"/>
  <polygon points="316,207 320,215 324,207" fill="#555"/>

  <!-- Action Head -->
  <rect x="250" y="215" width="140" height="35" rx="8" fill="#e74c3c" fill-opacity="0.15" stroke="#e74c3c" stroke-width="2"/>
  <text x="320" y="237" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="bold">Action Head</text>

  <!-- Three branches from Action Head -->
  <!-- Left branch -->
  <line x1="280" y1="250" x2="180" y2="265" stroke="#555" stroke-width="1"/>
  <text x="180" y="278" text-anchor="middle" fill="#666" font-size="9">Discrete bins (RT-2)</text>
  <!-- Center branch -->
  <line x1="320" y1="250" x2="320" y2="265" stroke="#555" stroke-width="1"/>
  <text x="320" y="278" text-anchor="middle" fill="#666" font-size="9">Diffusion (Octo)</text>
  <!-- Right branch -->
  <line x1="360" y1="250" x2="460" y2="265" stroke="#555" stroke-width="1"/>
  <text x="460" y="278" text-anchor="middle" fill="#666" font-size="9">Regression</text>

  <!-- Robot Action output -->
  <text x="350" y="298" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">Robot Action:</text>
  <text x="350" y="310" text-anchor="middle" fill="#666" font-size="9">Δx, Δy, Δz, Δroll, Δpitch, Δyaw, gripper</text>

  <!-- Caption -->
  <text x="350" y="295" text-anchor="middle" fill="none" font-size="1"> </text>
</svg>