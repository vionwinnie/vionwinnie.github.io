<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" font-family="sans-serif">
  <rect width="600" height="250" fill="white"/>

  <defs>
    <marker id="aD" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#555"/>
    </marker>
    <marker id="aP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#9b59b6"/>
    </marker>
  </defs>

  <!-- Simulation box (blue) -->
  <rect x="30" y="20" rx="8" ry="8" width="170" height="120" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="1.5"/>
  <text x="115" y="40" text-anchor="middle" font-size="13" fill="#3498db" font-weight="bold">Simulation</text>

  <text x="55" y="62" font-size="11" fill="#333">&#x2022; Physics Engine</text>
  <text x="55" y="80" font-size="11" fill="#333">&#x2022; Rendered Scenes</text>
  <text x="55" y="98" font-size="11" fill="#333">&#x2022; Domain</text>
  <text x="62" y="112" font-size="11" fill="#333">Randomization</text>

  <!-- Large transfer arrow -->
  <rect x="225" y="52" rx="6" ry="6" width="150" height="36" fill="rgba(243,156,18,0.15)" stroke="#f39c12" stroke-width="1.5"/>
  <text x="300" y="75" text-anchor="middle" font-size="13" fill="#f39c12" font-weight="bold">Transfer &#x2192;</text>

  <!-- Real World box (green) -->
  <rect x="400" y="20" rx="8" ry="8" width="170" height="120" fill="rgba(39,174,96,0.15)" stroke="#27ae60" stroke-width="1.5"/>
  <text x="485" y="40" text-anchor="middle" font-size="13" fill="#27ae60" font-weight="bold">Real World</text>

  <text x="425" y="62" font-size="11" fill="#333">&#x2022; Real Robot</text>
  <text x="425" y="80" font-size="11" fill="#333">&#x2022; Real Sensors</text>
  <text x="425" y="98" font-size="11" fill="#333">&#x2022; Real Dynamics</text>

  <!-- Reality Gap label -->
  <rect x="230" y="100" rx="6" ry="6" width="140" height="26" fill="rgba(155,89,182,0.15)" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="300" y="118" text-anchor="middle" font-size="12" fill="#9b59b6" font-weight="bold">Reality Gap</text>

  <!-- Three solution arrows -->
  <!-- Domain Randomization -->
  <line x1="250" y1="126" x2="140" y2="160" stroke="#9b59b6" stroke-width="1.5" marker-end="url(#aP)"/>
  <rect x="50" y="155" rx="8" ry="8" width="160" height="40" fill="rgba(155,89,182,0.08)" stroke="#9b59b6" stroke-width="1"/>
  <text x="130" y="171" text-anchor="middle" font-size="10" fill="#9b59b6" font-weight="bold">Domain Randomization</text>
  <text x="130" y="185" text-anchor="middle" font-size="9" fill="#666">Vary textures, friction, mass</text>

  <!-- System Identification -->
  <line x1="300" y1="126" x2="300" y2="155" stroke="#9b59b6" stroke-width="1.5" marker-end="url(#aP)"/>
  <rect x="220" y="155" rx="8" ry="8" width="160" height="40" fill="rgba(155,89,182,0.08)" stroke="#9b59b6" stroke-width="1"/>
  <text x="300" y="171" text-anchor="middle" font-size="10" fill="#9b59b6" font-weight="bold">System Identification</text>
  <text x="300" y="185" text-anchor="middle" font-size="9" fill="#666">Tune sim to match real</text>

  <!-- Domain Adaptation -->
  <line x1="350" y1="126" x2="460" y2="160" stroke="#9b59b6" stroke-width="1.5" marker-end="url(#aP)"/>
  <rect x="390" y="155" rx="8" ry="8" width="160" height="40" fill="rgba(155,89,182,0.08)" stroke="#9b59b6" stroke-width="1"/>
  <text x="470" y="171" text-anchor="middle" font-size="10" fill="#9b59b6" font-weight="bold">Domain Adaptation</text>
  <text x="470" y="185" text-anchor="middle" font-size="9" fill="#666">Learn invariant features</text>

  <!-- Caption -->
  <text x="300" y="225" text-anchor="middle" font-size="10" fill="#666">The reality gap between simulation and real world can be bridged</text>
  <text x="300" y="239" text-anchor="middle" font-size="10" fill="#666">by randomization, identification, or adaptation.</text>
</svg>