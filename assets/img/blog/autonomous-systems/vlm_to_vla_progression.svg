<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200" viewBox="0 0 700 200" font-family="sans-serif">
  <!-- Vision Models -->
  <rect x="20" y="20" width="180" height="55" rx="8" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="2"/>
  <text x="110" y="42" text-anchor="middle" fill="#3498db" font-size="13" font-weight="bold">Vision Models</text>
  <text x="110" y="60" text-anchor="middle" fill="#333" font-size="11">ResNet, ViT</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="47" x2="240" y2="47" stroke="#555" stroke-width="1.5"/>
  <polygon points="240,43 250,47 240,51" fill="#555"/>
  <text x="225" y="40" text-anchor="middle" fill="#f39c12" font-size="10" font-weight="bold">+</text>

  <!-- Vision-Language Models -->
  <rect x="250" y="20" width="180" height="55" rx="8" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="2"/>
  <text x="340" y="42" text-anchor="middle" fill="#27ae60" font-size="13" font-weight="bold">Vision-Language Models</text>
  <text x="340" y="60" text-anchor="middle" fill="#333" font-size="11">CLIP, LLaVA</text>

  <!-- Arrow 2 -->
  <line x1="430" y1="47" x2="470" y2="47" stroke="#555" stroke-width="1.5"/>
  <polygon points="470,43 480,47 470,51" fill="#555"/>
  <text x="455" y="40" text-anchor="middle" fill="#f39c12" font-size="10" font-weight="bold">+</text>

  <!-- Vision-Language-Action Models -->
  <rect x="480" y="20" width="200" height="55" rx="8" fill="#9b59b6" fill-opacity="0.15" stroke="#9b59b6" stroke-width="2"/>
  <text x="580" y="42" text-anchor="middle" fill="#9b59b6" font-size="13" font-weight="bold">Vision-Language-Action</text>
  <text x="580" y="60" text-anchor="middle" fill="#333" font-size="11">RT-2, Octo</text>

  <!-- Capability labels below each -->
  <rect x="40" y="95" width="140" height="40" rx="6" fill="#3498db" fill-opacity="0.08" stroke="#3498db" stroke-width="1"/>
  <text x="110" y="113" text-anchor="middle" fill="#3498db" font-size="11" font-weight="bold">See objects</text>
  <text x="110" y="126" text-anchor="middle" fill="#666" font-size="10">Image → Labels</text>

  <rect x="270" y="95" width="140" height="40" rx="6" fill="#27ae60" fill-opacity="0.08" stroke="#27ae60" stroke-width="1"/>
  <text x="340" y="113" text-anchor="middle" fill="#27ae60" font-size="11" font-weight="bold">+ Understand language</text>
  <text x="340" y="126" text-anchor="middle" fill="#666" font-size="10">Image + Text → Answers</text>

  <rect x="500" y="95" width="160" height="40" rx="6" fill="#9b59b6" fill-opacity="0.08" stroke="#9b59b6" stroke-width="1"/>
  <text x="580" y="113" text-anchor="middle" fill="#9b59b6" font-size="11" font-weight="bold">+ Take physical actions</text>
  <text x="580" y="126" text-anchor="middle" fill="#666" font-size="10">Image + Text → Actions</text>

  <!-- Dashed lines connecting boxes to labels -->
  <line x1="110" y1="75" x2="110" y2="95" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="340" y1="75" x2="340" y2="95" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="580" y1="75" x2="580" y2="95" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Caption -->
  <text x="350" y="170" text-anchor="middle" fill="#666" font-size="11" font-style="italic">VLAs extend VLMs with action output, enabling language-instructed physical manipulation.</text>
</svg>