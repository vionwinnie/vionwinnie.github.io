<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" font-family="sans-serif">
  <!-- Title -->
  <text x="350" y="22" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">SAE J3016 Levels of Driving Automation</text>

  <!-- L0 -->
  <rect x="20" y="40" width="85" height="60" rx="8" fill="#999999" fill-opacity="0.15" stroke="#999999" stroke-width="1.5"/>
  <text x="62" y="58" text-anchor="middle" fill="#999999" font-size="12" font-weight="bold">L0</text>
  <text x="62" y="73" text-anchor="middle" fill="#333" font-size="9">No automation</text>

  <!-- L1 -->
  <rect x="115" y="40" width="85" height="60" rx="8" fill="#85c1e9" fill-opacity="0.25" stroke="#85c1e9" stroke-width="1.5"/>
  <text x="157" y="58" text-anchor="middle" fill="#5dade2" font-size="12" font-weight="bold">L1</text>
  <text x="157" y="73" text-anchor="middle" fill="#333" font-size="9">Driver assistance</text>
  <text x="157" y="88" text-anchor="middle" fill="#666" font-size="8">cruise control</text>

  <!-- L2 -->
  <rect x="210" y="40" width="95" height="60" rx="8" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="1.5"/>
  <text x="257" y="58" text-anchor="middle" fill="#3498db" font-size="12" font-weight="bold">L2</text>
  <text x="257" y="73" text-anchor="middle" fill="#333" font-size="9">Partial</text>
  <text x="257" y="88" text-anchor="middle" fill="#666" font-size="8">Tesla Autopilot</text>

  <!-- L3 -->
  <rect x="315" y="40" width="100" height="60" rx="8" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
  <text x="365" y="58" text-anchor="middle" fill="#27ae60" font-size="12" font-weight="bold">L3</text>
  <text x="365" y="73" text-anchor="middle" fill="#333" font-size="9">Conditional</text>
  <text x="365" y="88" text-anchor="middle" fill="#666" font-size="8">Mercedes Drive Pilot</text>

  <!-- L4 - emphasized -->
  <rect x="425" y="35" width="120" height="70" rx="8" fill="#f39c12" fill-opacity="0.15" stroke="#f39c12" stroke-width="2.5"/>
  <text x="485" y="56" text-anchor="middle" fill="#f39c12" font-size="14" font-weight="bold">L4</text>
  <text x="485" y="72" text-anchor="middle" fill="#333" font-size="10">High</text>
  <text x="485" y="88" text-anchor="middle" fill="#f39c12" font-size="9" font-weight="bold">Waymo</text>

  <!-- L5 - dashed -->
  <rect x="555" y="40" width="120" height="60" rx="8" fill="#e74c3c" fill-opacity="0.10" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="615" y="58" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="bold">L5</text>
  <text x="615" y="73" text-anchor="middle" fill="#333" font-size="9">Full</text>
  <text x="615" y="88" text-anchor="middle" fill="#e74c3c" font-size="8" font-style="italic">Does not exist</text>

  <!-- Gradient bar -->
  <defs>
    <linearGradient id="levelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#999999;stop-opacity:0.4"/>
      <stop offset="15%" style="stop-color:#85c1e9;stop-opacity:0.4"/>
      <stop offset="30%" style="stop-color:#3498db;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#27ae60;stop-opacity:0.4"/>
      <stop offset="70%" style="stop-color:#f39c12;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.4"/>
    </linearGradient>
  </defs>
  <rect x="20" y="120" width="655" height="10" rx="5" fill="url(#levelGrad)" stroke="#aaa" stroke-width="0.5"/>

  <!-- Dividing line between L2 and L3 -->
  <line x1="310" y1="140" x2="310" y2="180" stroke="#333" stroke-width="1.5"/>

  <!-- Tick marks on gradient bar -->
  <line x1="62" y1="130" x2="62" y2="138" stroke="#999" stroke-width="1"/>
  <line x1="157" y1="130" x2="157" y2="138" stroke="#999" stroke-width="1"/>
  <line x1="257" y1="130" x2="257" y2="138" stroke="#999" stroke-width="1"/>
  <line x1="365" y1="130" x2="365" y2="138" stroke="#999" stroke-width="1"/>
  <line x1="485" y1="130" x2="485" y2="138" stroke="#999" stroke-width="1"/>
  <line x1="615" y1="130" x2="615" y2="138" stroke="#999" stroke-width="1"/>

  <!-- Labels below dividing line -->
  <text x="165" y="165" text-anchor="middle" fill="#3498db" font-size="11" font-weight="bold">Human monitors</text>
  <text x="165" y="180" text-anchor="middle" fill="#666" font-size="10">Driver is responsible</text>

  <text x="490" y="165" text-anchor="middle" fill="#27ae60" font-size="11" font-weight="bold">System monitors</text>
  <text x="490" y="180" text-anchor="middle" fill="#666" font-size="10">Vehicle is responsible</text>

  <!-- Arrow showing transition -->
  <line x1="260" y1="155" x2="295" y2="155" stroke="#555" stroke-width="1"/>
  <polygon points="295,151 303,155 295,159" fill="#555"/>
  <line x1="317" y1="155" x2="400" y2="155" stroke="#555" stroke-width="1"/>
  <polygon points="400,151 408,155 400,159" fill="#555"/>

  <!-- Transition label -->
  <text x="310" y="200" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">Human monitors → System monitors</text>

  <!-- Caption -->
  <text x="350" y="235" text-anchor="middle" fill="#666" font-size="10" font-style="italic">SAE levels define who monitors and who acts. Waymo operates at L4:</text>
  <text x="350" y="250" text-anchor="middle" fill="#666" font-size="10" font-style="italic">fully driverless within a defined operational design domain.</text>
</svg>