<svg xmlns="http://www.w3.org/2000/svg" width="650" height="220" viewBox="0 0 650 220" font-family="sans-serif">
  <!-- Stage 1: Internet Pre-training -->
  <rect x="15" y="20" width="220" height="105" rx="8" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="2"/>
  <text x="125" y="42" text-anchor="middle" fill="#3498db" font-size="13" font-weight="bold">Stage 1</text>
  <text x="125" y="58" text-anchor="middle" fill="#3498db" font-size="11">Internet Pre-training</text>
  <line x1="35" y1="66" x2="215" y2="66" stroke="#3498db" stroke-width="0.5" opacity="0.4"/>
  <text x="125" y="82" text-anchor="middle" fill="#333" font-size="10">Billions of image-text pairs</text>
  <text x="125" y="98" text-anchor="middle" fill="#666" font-size="9">Object recognition, spatial</text>
  <text x="125" y="111" text-anchor="middle" fill="#666" font-size="9">reasoning, instruction parsing</text>

  <!-- Arrow 1→2 -->
  <line x1="235" y1="72" x2="265" y2="72" stroke="#555" stroke-width="1.5"/>
  <polygon points="263,68 272,72 263,76" fill="#555"/>

  <!-- Stage 2: Robot Fine-tuning -->
  <rect x="272" y="20" width="220" height="105" rx="8" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="2"/>
  <text x="382" y="42" text-anchor="middle" fill="#27ae60" font-size="13" font-weight="bold">Stage 2</text>
  <text x="382" y="58" text-anchor="middle" fill="#27ae60" font-size="11">Robot Fine-tuning</text>
  <line x1="292" y1="66" x2="472" y2="66" stroke="#27ae60" stroke-width="0.5" opacity="0.4"/>
  <text x="382" y="82" text-anchor="middle" fill="#333" font-size="10">Open X-Embodiment</text>
  <text x="382" y="96" text-anchor="middle" fill="#666" font-size="9">1M+ episodes, 22 robots</text>
  <text x="382" y="111" text-anchor="middle" fill="#666" font-size="9">Physical interaction, motor control</text>

  <!-- Arrow 2→output -->
  <line x1="492" y1="72" x2="522" y2="72" stroke="#555" stroke-width="1.5"/>
  <polygon points="520,68 529,72 520,76" fill="#555"/>

  <!-- Final output -->
  <rect x="530" y="35" width="105" height="75" rx="8" fill="#9b59b6" fill-opacity="0.15" stroke="#9b59b6" stroke-width="2"/>
  <text x="582" y="65" text-anchor="middle" fill="#9b59b6" font-size="11" font-weight="bold">Generalist</text>
  <text x="582" y="80" text-anchor="middle" fill="#9b59b6" font-size="11" font-weight="bold">Robot Policy</text>
  <text x="582" y="98" text-anchor="middle" fill="#666" font-size="9">any task, any object</text>

  <!-- Key insight below the arrows -->
  <rect x="130" y="140" width="380" height="30" rx="6" fill="#f39c12" fill-opacity="0.1" stroke="#f39c12" stroke-width="1"/>
  <text x="320" y="160" text-anchor="middle" fill="#f39c12" font-size="10" font-weight="bold">Key insight: VLM world knowledge transfers to manipulation</text>

  <!-- Caption -->
  <text x="325" y="198" text-anchor="middle" fill="#666" font-size="11" font-style="italic">Two-stage recipe: pre-train on web data for understanding, fine-tune on robot data for action.</text>
</svg>