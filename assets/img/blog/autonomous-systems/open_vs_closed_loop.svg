<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" width="650" height="280" font-family="sans-serif">
  <!-- Left: Open-Loop -->
  <text x="160" y="22" text-anchor="middle" fill="#f39c12" font-size="14" font-weight="bold">Open-Loop</text>

  <rect x="60" y="35" width="120" height="34" rx="8" fill="#f39c12" fill-opacity="0.15" stroke="#f39c12" stroke-width="1.5"/>
  <text x="120" y="55" text-anchor="middle" fill="#f39c12" font-size="11">Recorded Drive</text>

  <line x1="120" y1="69" x2="120" y2="82" stroke="#555" stroke-width="1.5"/>
  <polygon points="115,82 120,89 125,82" fill="#555"/>

  <rect x="35" y="90" width="170" height="34" rx="8" fill="#f39c12" fill-opacity="0.15" stroke="#f39c12" stroke-width="1.5"/>
  <text x="120" y="110" text-anchor="middle" fill="#f39c12" font-size="11">Model predicts trajectory</text>

  <line x1="120" y1="124" x2="120" y2="137" stroke="#555" stroke-width="1.5"/>
  <polygon points="115,137 120,144 125,137" fill="#555"/>

  <rect x="25" y="145" width="190" height="34" rx="8" fill="#f39c12" fill-opacity="0.15" stroke="#f39c12" stroke-width="1.5"/>
  <text x="120" y="165" text-anchor="middle" fill="#f39c12" font-size="11">Compare to ground truth</text>

  <!-- Diverging lines illustration -->
  <line x1="70" y1="192" x2="170" y2="192" stroke="#f39c12" stroke-width="1.5"/>
  <line x1="70" y1="192" x2="170" y2="210" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="178" y="192" fill="#f39c12" font-size="9">Ground truth</text>
  <text x="178" y="212" fill="#e74c3c" font-size="9">Predicted</text>

  <text x="120" y="238" text-anchor="middle" fill="#666" font-size="11" font-style="italic">Simple but unrealistic</text>

  <!-- Divider -->
  <line x1="310" y1="15" x2="310" y2="240" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right: Closed-Loop -->
  <text x="480" y="22" text-anchor="middle" fill="#27ae60" font-size="14" font-weight="bold">Closed-Loop</text>

  <!-- Circular flow -->
  <rect x="410" y="40" width="110" height="34" rx="8" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
  <text x="465" y="60" text-anchor="middle" fill="#27ae60" font-size="11">Simulator</text>

  <!-- Arrow down-right -->
  <line x1="520" y1="57" x2="558" y2="90" stroke="#555" stroke-width="1.5"/>
  <polygon points="554,86 562,94 556,92" fill="#555"/>

  <rect x="500" y="95" width="110" height="34" rx="8" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
  <text x="555" y="115" text-anchor="middle" fill="#27ae60" font-size="11">Model acts</text>

  <!-- Arrow down-left -->
  <line x1="520" y1="129" x2="482" y2="160" stroke="#555" stroke-width="1.5"/>
  <polygon points="484,156 478,164 482,162" fill="#555"/>

  <rect x="380" y="155" width="130" height="34" rx="8" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
  <text x="445" y="175" text-anchor="middle" fill="#27ae60" font-size="11">World reacts</text>

  <!-- Arrow up-left back to Simulator -->
  <line x1="410" y1="160" x2="430" y2="74" stroke="#555" stroke-width="1.5"/>
  <polygon points="425,78 430,70 434,78" fill="#555"/>

  <!-- Circular arrows label -->
  <text x="435" y="120" text-anchor="middle" fill="#666" font-size="9">feedback</text>
  <text x="435" y="130" text-anchor="middle" fill="#666" font-size="9">loop</text>

  <!-- Ego + agents illustration -->
  <circle cx="440" cy="210" r="6" fill="#27ae60" fill-opacity="0.3" stroke="#27ae60" stroke-width="1"/>
  <text x="452" y="213" fill="#27ae60" font-size="8">ego</text>
  <circle cx="475" cy="205" r="4" fill="#555" fill-opacity="0.3" stroke="#555" stroke-width="1"/>
  <circle cx="488" cy="215" r="4" fill="#555" fill-opacity="0.3" stroke="#555" stroke-width="1"/>
  <text x="500" y="213" fill="#666" font-size="8">agents react</text>

  <text x="480" y="238" text-anchor="middle" fill="#666" font-size="11" font-style="italic">Realistic but expensive</text>

  <!-- Caption -->
  <text x="325" y="268" text-anchor="middle" fill="#666" font-size="10" font-style="italic">Open-loop compares to recordings; closed-loop lets the model's actions affect the simulated environment.</text>
</svg>