<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="sans-serif">
  <!-- Title: Modular -->
  <text x="15" y="22" fill="#3498db" font-size="13" font-weight="bold">Modular Pipeline</text>

  <!-- Modular row -->
  <rect x="10" y="35" width="90" height="40" rx="8" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="1.5"/>
  <text x="55" y="57" text-anchor="middle" fill="#3498db" font-size="11">Cameras/LiDAR</text>

  <line x1="100" y1="55" x2="118" y2="55" stroke="#555" stroke-width="1"/>
  <polygon points="118,51 124,55 118,59" fill="#555"/>

  <rect x="125" y="35" width="85" height="40" rx="8" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="1.5"/>
  <text x="167" y="57" text-anchor="middle" fill="#3498db" font-size="11">Perception</text>

  <!-- Barrier 1 -->
  <rect x="213" y="32" width="4" height="46" rx="1" fill="#e74c3c" fill-opacity="0.5" stroke="#e74c3c" stroke-width="0.5"/>
  <line x1="210" y1="55" x2="230" y2="55" stroke="#555" stroke-width="1"/>
  <polygon points="230,51 236,55 230,59" fill="#555"/>

  <rect x="237" y="35" width="85" height="40" rx="8" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="1.5"/>
  <text x="279" y="57" text-anchor="middle" fill="#3498db" font-size="11">Prediction</text>

  <!-- Barrier 2 -->
  <rect x="325" y="32" width="4" height="46" rx="1" fill="#e74c3c" fill-opacity="0.5" stroke="#e74c3c" stroke-width="0.5"/>
  <line x1="322" y1="55" x2="342" y2="55" stroke="#555" stroke-width="1"/>
  <polygon points="342,51 348,55 342,59" fill="#555"/>

  <rect x="349" y="35" width="75" height="40" rx="8" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="1.5"/>
  <text x="386" y="57" text-anchor="middle" fill="#3498db" font-size="11">Planning</text>

  <!-- Barrier 3 -->
  <rect x="427" y="32" width="4" height="46" rx="1" fill="#e74c3c" fill-opacity="0.5" stroke="#e74c3c" stroke-width="0.5"/>
  <line x1="424" y1="55" x2="444" y2="55" stroke="#555" stroke-width="1"/>
  <polygon points="444,51 450,55 444,59" fill="#555"/>

  <rect x="451" y="35" width="80" height="40" rx="8" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="1.5"/>
  <text x="491" y="57" text-anchor="middle" fill="#3498db" font-size="11">Trajectory</text>

  <!-- Barrier labels -->
  <text x="215" y="92" text-anchor="middle" fill="#e74c3c" font-size="8">Info</text>
  <text x="215" y="101" text-anchor="middle" fill="#e74c3c" font-size="8">bottleneck</text>
  <text x="327" y="92" text-anchor="middle" fill="#e74c3c" font-size="8">Info</text>
  <text x="327" y="101" text-anchor="middle" fill="#e74c3c" font-size="8">bottleneck</text>
  <text x="429" y="92" text-anchor="middle" fill="#e74c3c" font-size="8">Info</text>
  <text x="429" y="101" text-anchor="middle" fill="#e74c3c" font-size="8">bottleneck</text>

  <!-- Modular annotation -->
  <text x="555" y="50" fill="#3498db" font-size="11">Interpretable ✓</text>
  <text x="555" y="67" fill="#e74c3c" font-size="11">Bottlenecks ✗</text>

  <!-- Divider -->
  <line x1="10" y1="120" x2="690" y2="120" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Title: E2E -->
  <text x="15" y="145" fill="#27ae60" font-size="13" font-weight="bold">End-to-End</text>

  <!-- E2E row -->
  <rect x="10" y="158" width="90" height="40" rx="8" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
  <text x="55" y="180" text-anchor="middle" fill="#27ae60" font-size="11">Cameras/LiDAR</text>

  <line x1="100" y1="178" x2="118" y2="178" stroke="#555" stroke-width="1"/>
  <polygon points="118,174 124,178 118,182" fill="#555"/>

  <rect x="125" y="155" width="310" height="46" rx="8" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="2"/>
  <text x="280" y="175" text-anchor="middle" fill="#27ae60" font-size="13" font-weight="bold">Single Neural Network</text>
  <text x="280" y="191" text-anchor="middle" fill="#666" font-size="10">(EMMA / UniAD)</text>

  <line x1="435" y1="178" x2="448" y2="178" stroke="#555" stroke-width="1"/>
  <polygon points="448,174 454,178 448,182" fill="#555"/>

  <rect x="455" y="158" width="80" height="40" rx="8" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
  <text x="495" y="180" text-anchor="middle" fill="#27ae60" font-size="11">Trajectory</text>

  <!-- E2E annotation -->
  <text x="555" y="172" fill="#27ae60" font-size="11">Joint optimization ✓</text>
  <text x="555" y="189" fill="#e74c3c" font-size="11">Black box ✗</text>

  <!-- Caption -->
  <text x="350" y="240" text-anchor="middle" fill="#666" font-size="10" font-style="italic">Modular stacks are interpretable but lose information at module boundaries;</text>
  <text x="350" y="255" text-anchor="middle" fill="#666" font-size="10" font-style="italic">E2E models optimize jointly but sacrifice transparency.</text>
</svg>