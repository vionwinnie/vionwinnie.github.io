<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" font-family="sans-serif">
  <!-- Multi-Camera Images -->
  <rect x="230" y="10" width="240" height="36" rx="8" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="1.5"/>
  <text x="350" y="32" text-anchor="middle" fill="#3498db" font-size="12" font-weight="bold">Multi-Camera Images (4 frames)</text>

  <!-- Arrow down -->
  <line x1="350" y1="46" x2="350" y2="62" stroke="#555" stroke-width="1.5"/>
  <polygon points="345,62 350,70 355,62" fill="#555"/>

  <!-- Gemini box -->
  <rect x="100" y="72" width="500" height="120" rx="8" fill="#27ae60" fill-opacity="0.10" stroke="#27ae60" stroke-width="2"/>
  <text x="350" y="92" text-anchor="middle" fill="#27ae60" font-size="13" font-weight="bold">Gemini 1.0 Nano-1 (Pre-trained MLLM)</text>

  <!-- Task Prompt input from left -->
  <rect x="5" y="110" width="80" height="34" rx="8" fill="#f39c12" fill-opacity="0.15" stroke="#f39c12" stroke-width="1.5"/>
  <text x="45" y="130" text-anchor="middle" fill="#f39c12" font-size="10" font-weight="bold">Task Prompt</text>
  <line x1="85" y1="127" x2="98" y2="127" stroke="#555" stroke-width="1.5"/>
  <polygon points="98,123 105,127 98,131" fill="#555"/>

  <!-- Chain-of-Thought stages inside Gemini -->
  <rect x="120" y="105" width="110" height="28" rx="6" fill="#fff" fill-opacity="0.8" stroke="#27ae60" stroke-width="1"/>
  <text x="175" y="122" text-anchor="middle" fill="#333" font-size="9">R1: Scene Description</text>

  <line x1="230" y1="119" x2="240" y2="119" stroke="#555" stroke-width="1"/>
  <polygon points="240,116 245,119 240,122" fill="#555"/>

  <rect x="246" y="105" width="110" height="28" rx="6" fill="#fff" fill-opacity="0.8" stroke="#27ae60" stroke-width="1"/>
  <text x="301" y="122" text-anchor="middle" fill="#333" font-size="9">R2: Critical Objects</text>

  <line x1="356" y1="119" x2="366" y2="119" stroke="#555" stroke-width="1"/>
  <polygon points="366,116 371,119 366,122" fill="#555"/>

  <rect x="372" y="105" width="110" height="28" rx="6" fill="#fff" fill-opacity="0.8" stroke="#27ae60" stroke-width="1"/>
  <text x="427" y="122" text-anchor="middle" fill="#333" font-size="9">R3: Behavior Predictions</text>

  <!-- R4 below -->
  <line x1="482" y1="119" x2="492" y2="119" stroke="#555" stroke-width="1"/>
  <polygon points="492,116 497,119 492,122" fill="#555"/>

  <rect x="498" y="105" width="90" height="28" rx="6" fill="#fff" fill-opacity="0.8" stroke="#27ae60" stroke-width="1"/>
  <text x="543" y="122" text-anchor="middle" fill="#333" font-size="9">R4: Meta Decision</text>

  <!-- CoT label -->
  <text x="350" y="160" text-anchor="middle" fill="#27ae60" font-size="10" font-style="italic">Chain-of-Thought Reasoning</text>

  <!-- Three output arrows -->
  <line x1="220" y1="192" x2="220" y2="218" stroke="#555" stroke-width="1.5"/>
  <polygon points="215,218 220,226 225,218" fill="#555"/>

  <line x1="350" y1="192" x2="350" y2="218" stroke="#555" stroke-width="1.5"/>
  <polygon points="345,218 350,226 355,218" fill="#555"/>

  <line x1="480" y1="192" x2="480" y2="218" stroke="#555" stroke-width="1.5"/>
  <polygon points="475,218 480,226 485,218" fill="#555"/>

  <!-- Output 1: Trajectory Waypoints -->
  <rect x="80" y="228" width="160" height="44" rx="8" fill="#e74c3c" fill-opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="160" y="248" text-anchor="middle" fill="#e74c3c" font-size="11" font-weight="bold">Trajectory Waypoints</text>
  <text x="160" y="263" text-anchor="middle" fill="#666" font-size="9">x₁,y₁, x₂,y₂, ...</text>

  <!-- Output 2: 3D Detections -->
  <rect x="270" y="228" width="160" height="44" rx="8" fill="#9b59b6" fill-opacity="0.15" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="350" y="248" text-anchor="middle" fill="#9b59b6" font-size="11" font-weight="bold">3D Detections</text>
  <text x="350" y="263" text-anchor="middle" fill="#666" font-size="9">class, x,y,z,w,h,l</text>

  <!-- Output 3: Road Graph -->
  <rect x="460" y="228" width="160" height="44" rx="8" fill="#f39c12" fill-opacity="0.15" stroke="#f39c12" stroke-width="1.5"/>
  <text x="540" y="248" text-anchor="middle" fill="#f39c12" font-size="11" font-weight="bold">Road Graph</text>
  <text x="540" y="263" text-anchor="middle" fill="#666" font-size="9">lane boundaries</text>

  <!-- Bottom label -->
  <text x="350" y="295" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">All outputs as natural language text</text>

  <!-- Caption -->
  <text x="350" y="325" text-anchor="middle" fill="#666" font-size="10" font-style="italic">EMMA maps camera images to driving outputs through a pre-trained MLLM,</text>
  <text x="350" y="340" text-anchor="middle" fill="#666" font-size="10" font-style="italic">with chain-of-thought reasoning for interpretability.</text>
</svg>