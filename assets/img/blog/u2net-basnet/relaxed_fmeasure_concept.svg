<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#27ae60" stroke-width="1"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#e74c3c" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">
    Relaxed Boundary F-measure: Step-by-Step Algorithm
  </text>

  <!-- ========== ROW 1: Boundary Extraction ========== -->
  <text x="350" y="48" fill="#666" font-size="11" text-anchor="middle">
    Step 1: Extract 1-pixel boundaries via XOR(mask, erode(mask))
  </text>

  <!-- GT Mask box -->
  <rect x="30" y="58" width="90" height="70" rx="4" fill="#27ae60" fill-opacity="0.08" stroke="#27ae60" stroke-width="1.5"/>
  <text x="75" y="75" fill="#27ae60" font-size="10" text-anchor="middle" font-weight="bold">GT Mask</text>
  <!-- Simple mask shape -->
  <ellipse cx="75" cy="103" rx="28" ry="15" fill="#27ae60" fill-opacity="0.3" stroke="#27ae60" stroke-width="1"/>

  <!-- Arrow -->
  <line x1="125" y1="93" x2="155" y2="93" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="140" y="87" fill="#666" font-size="8" text-anchor="middle">XOR</text>

  <!-- GT Boundary box -->
  <rect x="160" y="58" width="90" height="70" rx="4" fill="#27ae60" fill-opacity="0.08" stroke="#27ae60" stroke-width="1.5"/>
  <text x="205" y="75" fill="#27ae60" font-size="10" text-anchor="middle" font-weight="bold">GT Boundary</text>
  <ellipse cx="205" cy="103" rx="28" ry="15" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Arrow to dilated -->
  <line x1="255" y1="93" x2="285" y2="93" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="270" y="87" fill="#666" font-size="8" text-anchor="middle">dilate ρ</text>

  <!-- GT Dilated Boundary -->
  <rect x="290" y="58" width="100" height="70" rx="4" fill="#27ae60" fill-opacity="0.08" stroke="#27ae60" stroke-width="1.5"/>
  <text x="340" y="75" fill="#27ae60" font-size="10" text-anchor="middle" font-weight="bold">GT Relaxed Zone</text>
  <ellipse cx="340" cy="103" rx="28" ry="15" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,2"/>
  <ellipse cx="340" cy="103" rx="34" ry="21" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="1"/>

  <!-- Separator -->
  <line x1="405" y1="63" x2="405" y2="123" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Pred Mask box -->
  <rect x="420" y="58" width="90" height="70" rx="4" fill="#e74c3c" fill-opacity="0.08" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="465" y="75" fill="#e74c3c" font-size="10" text-anchor="middle" font-weight="bold">Pred Mask</text>
  <!-- Slightly offset/larger ellipse for pred -->
  <ellipse cx="468" cy="104" rx="30" ry="16" fill="#e74c3c" fill-opacity="0.3" stroke="#e74c3c" stroke-width="1"/>

  <!-- Arrow -->
  <line x1="515" y1="93" x2="545" y2="93" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="530" y="87" fill="#666" font-size="8" text-anchor="middle">XOR</text>

  <!-- Pred Boundary -->
  <rect x="550" y="58" width="100" height="70" rx="4" fill="#e74c3c" fill-opacity="0.08" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="600" y="75" fill="#e74c3c" font-size="10" text-anchor="middle" font-weight="bold">Pred Boundary</text>
  <ellipse cx="603" cy="104" rx="30" ry="16" fill="none" stroke="#e74c3c" stroke-width="2"/>

  <!-- ========== ROW 2: Matching Diagram ========== -->
  <text x="350" y="158" fill="#666" font-size="11" text-anchor="middle">
    Step 2: Match boundary pixels within the ρ-dilated zone
  </text>

  <!-- LEFT: Relaxed Precision -->
  <rect x="30" y="170" width="310" height="160" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="185" y="190" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">Relaxed Precision</text>

  <!-- GT boundary (green thin) -->
  <path d="M 70,260 Q 100,220 140,230 Q 180,240 210,225 Q 250,210 280,250"
        fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="290" y="248" fill="#27ae60" font-size="9">GT boundary</text>

  <!-- GT relaxed zone (green band) -->
  <path d="M 70,260 Q 100,220 140,230 Q 180,240 210,225 Q 250,210 280,250"
        fill="none" stroke="#27ae60" stroke-width="14" stroke-opacity="0.15"/>
  <text x="76" y="218" fill="#27ae60" font-size="8" font-style="italic">ρ-zone</text>

  <!-- Pred boundary points - some inside zone (green dots), some outside (red dots) -->
  <!-- Inside zone (matched) -->
  <circle cx="82" cy="255" r="3" fill="#27ae60"/>
  <circle cx="105" cy="230" r="3" fill="#27ae60"/>
  <circle cx="125" cy="228" r="3" fill="#27ae60"/>
  <circle cx="148" cy="234" r="3" fill="#27ae60"/>
  <circle cx="168" cy="237" r="3" fill="#27ae60"/>
  <circle cx="188" cy="233" r="3" fill="#27ae60"/>
  <circle cx="215" cy="222" r="3" fill="#27ae60"/>
  <circle cx="238" cy="215" r="3" fill="#27ae60"/>
  <circle cx="258" cy="220" r="3" fill="#27ae60"/>

  <!-- Outside zone (unmatched) -->
  <circle cx="92" cy="275" r="3" fill="#e74c3c"/>
  <circle cx="160" cy="260" r="3" fill="#e74c3c"/>
  <circle cx="270" cy="268" r="3" fill="#e74c3c"/>

  <!-- Legend for precision panel -->
  <circle cx="55" cy="298" r="3" fill="#27ae60"/>
  <text x="63" y="301" fill="#666" font-size="9">= pred pixel inside GT zone (matched)</text>
  <circle cx="55" cy="313" r="3" fill="#e74c3c"/>
  <text x="63" y="316" fill="#666" font-size="9">= pred pixel outside GT zone (unmatched)</text>

  <!-- RIGHT: Relaxed Recall -->
  <rect x="360" y="170" width="310" height="160" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="515" y="190" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">Relaxed Recall</text>

  <!-- Pred boundary (red thin) -->
  <path d="M 400,255 Q 430,225 470,235 Q 510,245 540,228 Q 575,215 610,252"
        fill="none" stroke="#e74c3c" stroke-width="2"/>
  <text x="618" y="250" fill="#e74c3c" font-size="9">Pred</text>

  <!-- Pred relaxed zone (red band) -->
  <path d="M 400,255 Q 430,225 470,235 Q 510,245 540,228 Q 575,215 610,252"
        fill="none" stroke="#e74c3c" stroke-width="14" stroke-opacity="0.15"/>
  <text x="406" y="222" fill="#e74c3c" font-size="8" font-style="italic">ρ-zone</text>

  <!-- GT boundary points - some inside zone (green), some outside (red) -->
  <!-- Inside zone (matched) -->
  <circle cx="410" cy="248" r="3" fill="#27ae60"/>
  <circle cx="432" cy="232" r="3" fill="#27ae60"/>
  <circle cx="455" cy="230" r="3" fill="#27ae60"/>
  <circle cx="478" cy="238" r="3" fill="#27ae60"/>
  <circle cx="498" cy="240" r="3" fill="#27ae60"/>
  <circle cx="522" cy="236" r="3" fill="#27ae60"/>
  <circle cx="548" cy="225" r="3" fill="#27ae60"/>
  <circle cx="572" cy="220" r="3" fill="#27ae60"/>
  <circle cx="598" cy="240" r="3" fill="#27ae60"/>

  <!-- Outside zone (unmatched) -->
  <circle cx="420" cy="270" r="3" fill="#e74c3c"/>
  <circle cx="490" cy="260" r="3" fill="#e74c3c"/>

  <!-- Legend for recall panel -->
  <circle cx="385" cy="298" r="3" fill="#27ae60"/>
  <text x="393" y="301" fill="#666" font-size="9">= GT pixel inside pred zone (matched)</text>
  <circle cx="385" cy="313" r="3" fill="#e74c3c"/>
  <text x="393" y="316" fill="#666" font-size="9">= GT pixel outside pred zone (unmatched)</text>

  <!-- ========== ROW 3: Formulas ========== -->
  <rect x="30" y="348" width="640" height="120" rx="6" fill="white" stroke="#3498db" stroke-width="1.5"/>
  <text x="350" y="370" fill="#333" font-size="12" font-weight="bold" text-anchor="middle">
    Step 3: Compute Relaxed F-measure
  </text>

  <!-- Precision formula -->
  <text x="175" y="395" fill="#27ae60" font-size="11" text-anchor="middle" font-weight="bold">
    relaxPrecision^b
  </text>
  <text x="175" y="412" fill="#666" font-size="10" text-anchor="middle">
    = matched pred pixels / total pred boundary pixels
  </text>

  <!-- Recall formula -->
  <text x="525" y="395" fill="#e74c3c" font-size="11" text-anchor="middle" font-weight="bold">
    relaxRecall^b
  </text>
  <text x="525" y="412" fill="#666" font-size="10" text-anchor="middle">
    = matched GT pixels / total GT boundary pixels
  </text>

  <!-- F-measure formula -->
  <text x="350" y="440" fill="#333" font-size="11" text-anchor="middle" font-weight="bold">
    relaxF^b_β  =  (1 + β²) × relaxPrecision^b × relaxRecall^b  /  (β² × relaxPrecision^b + relaxRecall^b)
  </text>
  <text x="350" y="458" fill="#999" font-size="10" text-anchor="middle">
    β² = 0.3 (weights precision more than recall)  ·  ρ = 3 pixels (boundary slack)
  </text>

  <!-- ========== Bottom Note ========== -->
  <rect x="100" y="484" width="500" height="30" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="350" y="503" fill="#333" font-size="10" text-anchor="middle">
    Relaxed F-measure tolerates small boundary misalignments (≤ρ px), evaluating boundary quality rather than pixel-exact overlap.
  </text>
</svg>
