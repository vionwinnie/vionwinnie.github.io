<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="24" font-size="14" fill="#333" font-weight="bold" text-anchor="middle">Single Training Step Pipeline</text>

  <!-- ============ BOX 1: SAMPLE TIMESTEP ============ -->
  <rect x="16" y="50" width="118" height="70" rx="4" fill="rgba(52,152,219,0.1)" stroke="#3498db" stroke-width="1.5"/>
  <text x="75" y="68" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">Sample t</text>
  <text x="75" y="82" font-size="8" fill="#3498db" text-anchor="middle">t ∈ {1.0, 0.75,</text>
  <text x="75" y="93" font-size="8" fill="#3498db" text-anchor="middle">0.5, 0.25}</text>

  <!-- Annotation below box 1 -->
  <rect x="4" y="126" width="142" height="38" rx="3" fill="rgba(52,152,219,0.05)" stroke="#3498db" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="75" y="140" font-size="8" fill="#666" text-anchor="middle">Curriculum: warmup favors</text>
  <text x="75" y="150" font-size="8" fill="#666" text-anchor="middle">easy (t=0.25), main phase</text>
  <text x="75" y="160" font-size="8" fill="#666" text-anchor="middle">favors hard (t=1.0)</text>

  <!-- Arrow 1→2 -->
  <line x1="134" y1="85" x2="156" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ BOX 2: STUDENT FORWARD ============ -->
  <rect x="158" y="50" width="110" height="70" rx="4" fill="rgba(52,152,219,0.1)" stroke="#3498db" stroke-width="1.5"/>
  <text x="213" y="68" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">Student Forward</text>
  <text x="213" y="86" font-size="9" fill="#3498db" text-anchor="middle">x_t → v_θ → x̂₀</text>
  <text x="213" y="100" font-size="8" fill="#666" text-anchor="middle">velocity prediction</text>

  <!-- Arrow 2→3 -->
  <line x1="268" y1="85" x2="290" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ BOX 3: RE-NOISE ============ -->
  <rect x="292" y="42" width="120" height="100" rx="4" fill="rgba(230,126,34,0.1)" stroke="#e67e22" stroke-width="1.5"/>
  <text x="352" y="60" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">Re-noise</text>
  <text x="352" y="76" font-size="8" fill="#e67e22" text-anchor="middle">t̂ ~ LogitNormal</text>
  <text x="352" y="87" font-size="8" fill="#e67e22" text-anchor="middle">(0.5, 1.0)</text>

  <!-- Divider inside box 3 -->
  <line x1="302" y1="94" x2="402" y2="94" stroke="#e67e22" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Fake output -->
  <text x="352" y="108" font-size="8" fill="#3498db" text-anchor="middle">Fake: (1-t̂)x̂₀ + t̂ε₁</text>
  <!-- Real output -->
  <text x="352" y="122" font-size="8" fill="#e67e22" text-anchor="middle">Real: (1-t̂)x₀ + t̂ε₂</text>

  <!-- Annotation below box 3 -->
  <rect x="296" y="148" width="112" height="24" rx="3" fill="rgba(230,126,34,0.05)" stroke="#e67e22" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="352" y="162" font-size="8" fill="#666" text-anchor="middle">Independent noise ε₁, ε₂</text>

  <!-- Arrow 3→4 -->
  <line x1="412" y1="85" x2="434" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ BOX 4: TEACHER FORWARD ============ -->
  <rect x="436" y="50" width="110" height="70" rx="4" fill="rgba(230,126,34,0.1)" stroke="#e67e22" stroke-width="1.5"/>
  <text x="491" y="68" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">Teacher Forward</text>
  <text x="491" y="84" font-size="9" fill="#e67e22" text-anchor="middle">Extract features</text>
  <text x="491" y="98" font-size="8" fill="#666" text-anchor="middle">at 6 layers</text>
  <text x="491" y="110" font-size="8" fill="#666" text-anchor="middle">{5,10,15,20,25,29}</text>

  <!-- Arrow 4→5 -->
  <line x1="546" y1="85" x2="568" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ BOX 5: DISCRIMINATOR ============ -->
  <rect x="570" y="50" width="114" height="70" rx="4" fill="rgba(231,76,60,0.1)" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="627" y="68" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">Discriminator</text>
  <text x="627" y="84" font-size="9" fill="#e74c3c" text-anchor="middle">Hinge Loss</text>
  <text x="627" y="100" font-size="8" fill="#666" text-anchor="middle">d_loss + g_loss</text>

  <!-- ============ UPDATE SCHEDULE (below pipeline) ============ -->
  <text x="350" y="210" font-size="11" fill="#666" font-weight="bold" text-anchor="middle">Update Schedule</text>

  <!-- Disc update row -->
  <rect x="80" y="222" width="250" height="34" rx="4" fill="rgba(231,76,60,0.08)" stroke="#e74c3c" stroke-width="1"/>
  <text x="205" y="238" font-size="10" fill="#e74c3c" font-weight="bold" text-anchor="middle">Discriminator update: every step</text>
  <text x="205" y="250" font-size="9" fill="#666" text-anchor="middle">lr = 5e-5</text>

  <!-- Student update row -->
  <rect x="370" y="222" width="250" height="34" rx="4" fill="rgba(52,152,219,0.08)" stroke="#3498db" stroke-width="1"/>
  <text x="495" y="238" font-size="10" fill="#3498db" font-weight="bold" text-anchor="middle">Student update: every 3 steps</text>
  <text x="495" y="250" font-size="9" fill="#666" text-anchor="middle">lr = 5e-6</text>

  <!-- Visual representation of update cadence -->
  <text x="350" y="284" font-size="9" fill="#666" text-anchor="middle">Step cadence visualization:</text>

  <!-- Step boxes -->
  <text x="120" y="306" font-size="8" fill="#999" text-anchor="middle">Step 1</text>
  <text x="220" y="306" font-size="8" fill="#999" text-anchor="middle">Step 2</text>
  <text x="320" y="306" font-size="8" fill="#999" text-anchor="middle">Step 3</text>
  <text x="420" y="306" font-size="8" fill="#999" text-anchor="middle">Step 4</text>
  <text x="520" y="306" font-size="8" fill="#999" text-anchor="middle">Step 5</text>
  <text x="620" y="306" font-size="8" fill="#999" text-anchor="middle">Step 6</text>

  <!-- Disc updates (every step) -->
  <rect x="90" y="310" width="60" height="16" rx="3" fill="rgba(231,76,60,0.15)" stroke="#e74c3c" stroke-width="1"/>
  <text x="120" y="322" font-size="7" fill="#e74c3c" font-weight="bold" text-anchor="middle">D update</text>
  <rect x="190" y="310" width="60" height="16" rx="3" fill="rgba(231,76,60,0.15)" stroke="#e74c3c" stroke-width="1"/>
  <text x="220" y="322" font-size="7" fill="#e74c3c" font-weight="bold" text-anchor="middle">D update</text>
  <rect x="290" y="310" width="60" height="16" rx="3" fill="rgba(231,76,60,0.15)" stroke="#e74c3c" stroke-width="1"/>
  <text x="320" y="322" font-size="7" fill="#e74c3c" font-weight="bold" text-anchor="middle">D update</text>
  <rect x="390" y="310" width="60" height="16" rx="3" fill="rgba(231,76,60,0.15)" stroke="#e74c3c" stroke-width="1"/>
  <text x="420" y="322" font-size="7" fill="#e74c3c" font-weight="bold" text-anchor="middle">D update</text>
  <rect x="490" y="310" width="60" height="16" rx="3" fill="rgba(231,76,60,0.15)" stroke="#e74c3c" stroke-width="1"/>
  <text x="520" y="322" font-size="7" fill="#e74c3c" font-weight="bold" text-anchor="middle">D update</text>
  <rect x="590" y="310" width="60" height="16" rx="3" fill="rgba(231,76,60,0.15)" stroke="#e74c3c" stroke-width="1"/>
  <text x="620" y="322" font-size="7" fill="#e74c3c" font-weight="bold" text-anchor="middle">D update</text>

  <!-- Student updates (every 3 steps) -->
  <rect x="290" y="330" width="60" height="16" rx="3" fill="rgba(52,152,219,0.2)" stroke="#3498db" stroke-width="1.5"/>
  <text x="320" y="342" font-size="7" fill="#3498db" font-weight="bold" text-anchor="middle">S update</text>
  <rect x="590" y="330" width="60" height="16" rx="3" fill="rgba(52,152,219,0.2)" stroke="#3498db" stroke-width="1.5"/>
  <text x="620" y="342" font-size="7" fill="#3498db" font-weight="bold" text-anchor="middle">S update</text>

  <!-- No student update markers -->
  <text x="120" y="342" font-size="7" fill="#999" text-anchor="middle">—</text>
  <text x="220" y="342" font-size="7" fill="#999" text-anchor="middle">—</text>
  <text x="420" y="342" font-size="7" fill="#999" text-anchor="middle">—</text>
  <text x="520" y="342" font-size="7" fill="#999" text-anchor="middle">—</text>

  <!-- ============ BOTTOM NOTE ============ -->
  <rect x="40" y="370" width="620" height="44" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="350" y="390" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">Asymmetric updates give the discriminator time to form stable gradients before updating the student.</text>
  <text x="350" y="404" font-size="9" fill="#666" text-anchor="middle">The 3:1 ratio prevents mode collapse — the student never outruns the discriminator's ability to judge quality.</text>
</svg>