<svg xmlns="http://www.w3.org/2000/svg" width="700" height="580">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#3498db" stroke-width="1"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#e67e22" stroke-width="1"/>
    </marker>
    <marker id="arr-grn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#27ae60" stroke-width="1"/>
    </marker>
    <pattern id="noise" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#ddd"/>
      <rect x="0" y="0" width="2" height="2" fill="#bbb"/>
      <rect x="2" y="2" width="2" height="2" fill="#bbb"/>
    </pattern>
    <pattern id="noise-light" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#e8e8e8"/>
      <rect x="0" y="0" width="2" height="2" fill="#ddd"/>
      <rect x="2" y="2" width="2" height="2" fill="#ddd"/>
    </pattern>
  </defs>

  <!-- Title -->
  <text x="350" y="22" font-size="14" fill="#333" font-weight="bold" text-anchor="middle">LADD Training Pipeline</text>

  <!-- STAGE 1 boundary -->
  <rect x="10" y="36" width="250" height="130" rx="6" fill="none" stroke="#e67e22" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="135" y="50" font-size="10" fill="#e67e22" font-weight="bold" text-anchor="middle">Stage 1: Offline Precompute</text>

  <!-- Noise box -->
  <rect x="22" y="64" width="40" height="40" rx="2" fill="url(#noise)" stroke="#999" stroke-width="1"/>
  <text x="42" y="118" font-size="8" fill="#666" text-anchor="middle">noise</text>

  <!-- Arrow noise to Teacher -->
  <line x1="62" y1="84" x2="78" y2="84" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Teacher box -->
  <rect x="80" y="64" width="60" height="40" rx="4" fill="rgba(230,126,34,0.12)" stroke="#e67e22" stroke-width="1.5"/>
  <text x="110" y="80" font-size="9" fill="#333" font-weight="bold" text-anchor="middle">Teacher</text>
  <text x="110" y="92" font-size="8" fill="#e67e22" text-anchor="middle">50 steps</text>
  <!-- F badge -->
  <rect x="128" y="58" width="14" height="12" rx="2" fill="#e8f4fd" stroke="#3498db" stroke-width="0.8"/>
  <text x="135" y="67" font-size="7" fill="#3498db" text-anchor="middle" font-weight="bold">F</text>

  <!-- Arrow Teacher to x0 -->
  <line x1="140" y1="84" x2="156" y2="84" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Clean x0 box -->
  <rect x="158" y="64" width="44" height="40" rx="2" fill="rgba(39,174,96,0.15)" stroke="#27ae60" stroke-width="1.5"/>
  <text x="180" y="82" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">x&#x2080;</text>
  <text x="180" y="94" font-size="7" fill="#27ae60" text-anchor="middle">CFG=5</text>
  <text x="180" y="118" font-size="8" fill="#666" text-anchor="middle">teacher latent</text>

  <!-- Text encoder below -->
  <rect x="22" y="132" width="88" height="24" rx="4" fill="rgba(155,89,182,0.08)" stroke="#9b59b6" stroke-width="1"/>
  <text x="66" y="148" font-size="8" fill="#9b59b6" text-anchor="middle">Qwen3 Text Enc. (F)</text>

  <!-- STAGE 2 boundary -->
  <rect x="270" y="36" width="260" height="130" rx="6" fill="none" stroke="#3498db" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="400" y="50" font-size="10" fill="#3498db" font-weight="bold" text-anchor="middle">Stage 2: Student Prediction</text>

  <!-- Arrow x0 to plus -->
  <line x1="202" y1="84" x2="290" y2="84" stroke="#555" stroke-width="1"/>

  <!-- Plus circle -->
  <circle cx="300" cy="84" r="10" fill="white" stroke="#555" stroke-width="1"/>
  <text x="300" y="88" font-size="12" fill="#555" text-anchor="middle">+</text>
  <text x="300" y="70" font-size="7" fill="#666" text-anchor="middle">add noise t</text>

  <!-- Arrow plus to x_t -->
  <line x1="310" y1="84" x2="326" y2="84" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- x_t box -->
  <rect x="328" y="64" width="40" height="40" rx="2" fill="url(#noise-light)" stroke="#999" stroke-width="1"/>
  <text x="348" y="87" font-size="9" fill="#333" font-weight="bold" text-anchor="middle">x_t</text>
  <text x="348" y="118" font-size="7" fill="#666" text-anchor="middle">(1-t)x&#x2080;+t&#x3B5;</text>

  <!-- Arrow x_t to Student -->
  <line x1="368" y1="84" x2="384" y2="84" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Student box -->
  <rect x="386" y="60" width="68" height="48" rx="4" fill="rgba(52,152,219,0.12)" stroke="#3498db" stroke-width="2"/>
  <text x="420" y="78" font-size="9" fill="#333" font-weight="bold" text-anchor="middle">Student</text>
  <text x="420" y="90" font-size="8" fill="#3498db" text-anchor="middle">6.15B</text>
  <text x="420" y="101" font-size="7" fill="#666" text-anchor="middle">velocity v&#x3B8;</text>
  <!-- T badge -->
  <rect x="442" y="54" width="14" height="12" rx="2" fill="#fde8e8" stroke="#e74c3c" stroke-width="0.8"/>
  <text x="449" y="63" font-size="7" fill="#e74c3c" text-anchor="middle" font-weight="bold">T</text>

  <!-- Arrow Student to x0hat -->
  <line x1="454" y1="84" x2="470" y2="84" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Student prediction x0hat -->
  <rect x="472" y="64" width="44" height="40" rx="2" fill="rgba(52,152,219,0.1)" stroke="#3498db" stroke-width="1.5"/>
  <text x="494" y="83" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">x&#x0302;&#x2080;</text>
  <text x="494" y="95" font-size="7" fill="#3498db" text-anchor="middle">4 steps</text>
  <text x="494" y="118" font-size="8" fill="#666" text-anchor="middle">student pred</text>

  <!-- Prompt embeds dashed arrow -->
  <line x1="110" y1="148" x2="410" y2="112" stroke="#9b59b6" stroke-width="0.8" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- STAGE 3 boundary -->
  <rect x="10" y="180" width="680" height="340" rx="6" fill="none" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="350" y="196" font-size="10" fill="#e74c3c" font-weight="bold" text-anchor="middle">Stage 3: Projected GAN Loss on Teacher Features</text>

  <!-- FAKE PATH label -->
  <text x="130" y="218" font-size="9" fill="#3498db" font-weight="bold" text-anchor="middle">Fake Path</text>

  <!-- Dashed arrow from student x0hat down to fake x0hat -->
  <path d="M494,104 L494,140 Q494,150 484,150 L60,150 Q50,150 50,160 L50,230" stroke="#3498db" stroke-width="1" fill="none" stroke-dasharray="4,2" marker-end="url(#arr-blue)"/>

  <!-- Fake x0hat box -->
  <rect x="30" y="232" width="40" height="40" rx="2" fill="rgba(52,152,219,0.1)" stroke="#3498db" stroke-width="1"/>
  <text x="50" y="250" font-size="9" fill="#333" font-weight="bold" text-anchor="middle">x&#x0302;&#x2080;</text>
  <text x="50" y="262" font-size="7" fill="#3498db" text-anchor="middle">student</text>

  <!-- Plus noise circle -->
  <circle cx="90" cy="252" r="10" fill="white" stroke="#555" stroke-width="1"/>
  <text x="90" y="256" font-size="12" fill="#555" text-anchor="middle">+</text>
  <text x="90" y="236" font-size="7" fill="#666" text-anchor="middle">t&#x0302; noise</text>

  <line x1="70" y1="252" x2="78" y2="252" stroke="#555" stroke-width="1"/>
  <line x1="100" y1="252" x2="116" y2="252" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Fake re-noised -->
  <rect x="118" y="232" width="44" height="40" rx="2" fill="url(#noise-light)" stroke="#3498db" stroke-width="1"/>
  <text x="140" y="250" font-size="8" fill="#333" font-weight="bold" text-anchor="middle">fake</text>
  <text x="140" y="262" font-size="7" fill="#666" text-anchor="middle">re-noised</text>

  <!-- Arrow fake to teacher -->
  <line x1="162" y1="252" x2="162" y2="310" stroke="#3498db" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- REAL PATH label -->
  <text x="560" y="218" font-size="9" fill="#e67e22" font-weight="bold" text-anchor="middle">Real Path</text>

  <!-- Dashed arrow from teacher x0 down to real x0 -->
  <path d="M180,104 L180,150 Q180,160 190,160 L620,160 Q630,160 630,170 L630,230" stroke="#e67e22" stroke-width="1" fill="none" stroke-dasharray="4,2" marker-end="url(#arr-orange)"/>

  <!-- Real x0 box -->
  <rect x="610" y="232" width="40" height="40" rx="2" fill="rgba(39,174,96,0.15)" stroke="#27ae60" stroke-width="1"/>
  <text x="630" y="250" font-size="9" fill="#333" font-weight="bold" text-anchor="middle">x&#x2080;</text>
  <text x="630" y="262" font-size="7" fill="#27ae60" text-anchor="middle">teacher</text>

  <!-- Plus noise circle -->
  <circle cx="580" cy="252" r="10" fill="white" stroke="#555" stroke-width="1"/>
  <text x="580" y="256" font-size="12" fill="#555" text-anchor="middle">+</text>
  <text x="580" y="236" font-size="7" fill="#666" text-anchor="middle">t&#x0302; noise</text>

  <line x1="600" y1="252" x2="568" y2="252" stroke="#555" stroke-width="1"/>
  <line x1="570" y1="252" x2="554" y2="252" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Real re-noised -->
  <rect x="510" y="232" width="44" height="40" rx="2" fill="url(#noise-light)" stroke="#e67e22" stroke-width="1"/>
  <text x="532" y="250" font-size="8" fill="#333" font-weight="bold" text-anchor="middle">real</text>
  <text x="532" y="262" font-size="7" fill="#666" text-anchor="middle">re-noised</text>

  <!-- Arrow real to teacher -->
  <line x1="532" y1="272" x2="532" y2="310" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="570" y="300" font-size="8" fill="#e74c3c" font-weight="bold">no_grad</text>

  <!-- TEACHER box (wide, center) -->
  <rect x="100" y="312" width="490" height="52" rx="4" fill="rgba(230,126,34,0.12)" stroke="#e67e22" stroke-width="2"/>
  <text x="345" y="332" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">Teacher (frozen)</text>
  <text x="345" y="346" font-size="8" fill="#e67e22" text-anchor="middle">6.15B params  |  extract hidden states at layers [5, 10, 15, 20, 25, 29]</text>
  <text x="345" y="358" font-size="7" fill="#666" text-anchor="middle">frozen weights, but gradient graph kept alive on fake path</text>

  <!-- Discriminator Heads label -->
  <text x="270" y="386" font-size="9" fill="#e74c3c" font-weight="bold" text-anchor="middle">Discriminator Heads (14M, trainable)</text>

  <!-- 6 head boxes -->
  <rect x="100" y="394" width="36" height="20" rx="3" fill="rgba(231,76,60,0.1)" stroke="#e74c3c" stroke-width="1"/>
  <text x="118" y="408" font-size="7" fill="#e74c3c" text-anchor="middle">L5</text>
  <line x1="118" y1="364" x2="118" y2="394" stroke="#e74c3c" stroke-width="0.8"/>

  <rect x="150" y="394" width="36" height="20" rx="3" fill="rgba(231,76,60,0.1)" stroke="#e74c3c" stroke-width="1"/>
  <text x="168" y="408" font-size="7" fill="#e74c3c" text-anchor="middle">L10</text>
  <line x1="168" y1="364" x2="168" y2="394" stroke="#e74c3c" stroke-width="0.8"/>

  <rect x="200" y="394" width="36" height="20" rx="3" fill="rgba(231,76,60,0.1)" stroke="#e74c3c" stroke-width="1"/>
  <text x="218" y="408" font-size="7" fill="#e74c3c" text-anchor="middle">L15</text>
  <line x1="218" y1="364" x2="218" y2="394" stroke="#e74c3c" stroke-width="0.8"/>

  <rect x="250" y="394" width="36" height="20" rx="3" fill="rgba(231,76,60,0.1)" stroke="#e74c3c" stroke-width="1"/>
  <text x="268" y="408" font-size="7" fill="#e74c3c" text-anchor="middle">L20</text>
  <line x1="268" y1="364" x2="268" y2="394" stroke="#e74c3c" stroke-width="0.8"/>

  <rect x="300" y="394" width="36" height="20" rx="3" fill="rgba(231,76,60,0.1)" stroke="#e74c3c" stroke-width="1"/>
  <text x="318" y="408" font-size="7" fill="#e74c3c" text-anchor="middle">L25</text>
  <line x1="318" y1="364" x2="318" y2="394" stroke="#e74c3c" stroke-width="0.8"/>

  <rect x="350" y="394" width="36" height="20" rx="3" fill="rgba(231,76,60,0.1)" stroke="#e74c3c" stroke-width="1"/>
  <text x="368" y="408" font-size="7" fill="#e74c3c" text-anchor="middle">L29</text>
  <line x1="368" y1="364" x2="368" y2="394" stroke="#e74c3c" stroke-width="0.8"/>

  <!-- Sum arrow -->
  <line x1="386" y1="404" x2="416" y2="404" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
  <text x="402" y="398" font-size="8" fill="#555" text-anchor="middle">sum</text>

  <!-- Real/fake label -->
  <text x="440" y="400" font-size="7" fill="#27ae60">real</text>
  <text x="440" y="412" font-size="7" fill="#e74c3c">fake</text>

  <!-- Arrow to Hinge Loss -->
  <line x1="460" y1="404" x2="486" y2="404" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Hinge Loss box -->
  <rect x="488" y="390" width="80" height="28" rx="4" fill="rgba(231,76,60,0.12)" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="528" y="408" font-size="9" fill="#e74c3c" font-weight="bold" text-anchor="middle">Hinge Loss</text>

  <!-- GRADIENT FLOW -->
  <text x="350" y="450" font-size="9" fill="#27ae60" font-weight="bold" text-anchor="middle">Gradient Flow (backprop through frozen teacher to student)</text>
  <path d="M528,418 L528,460 Q528,468 518,468 L50,468 Q40,468 40,458 L40,155 Q40,148 48,148 L395,148 Q405,148 410,138 L415,112" stroke="#27ae60" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-grn)"/>

  <!-- Bottom note -->
  <rect x="80" y="490" width="540" height="32" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="350" y="506" font-size="10" fill="#333" font-weight="bold" text-anchor="middle">LADD operates entirely in latent space.</text>
  <text x="350" y="517" font-size="8" fill="#666" text-anchor="middle">The discriminator sees teacher features, not pixels. F = frozen | T = trainable</text>
</svg>