  <rect x="42" y="344" width="76" height="14" rx="2" fill="rgba(52,152,219,0.2)" stroke="#3498db" stroke-width="1.5"/>
  <text x="80" y="355" font-size="8" fill="#3498db" font-weight="bold" text-anchor="middle">Layer 20</text>

  <!-- Layers 21-24 -->
  <rect x="42" y="362" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
  <rect x="42" y="376" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
  <rect x="42" y="390" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
