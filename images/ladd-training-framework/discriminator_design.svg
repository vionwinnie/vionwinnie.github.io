<svg xmlns="http://www.w3.org/2000/svg" width="700" height="580">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="24" font-size="14" fill="#333" font-weight="bold" text-anchor="middle">Multi-Scale Discriminator — Feature Extraction from Teacher Layers</text>

  <!-- ============ FiLM CONDITIONING (top) ============ -->
  <text x="450" y="52" font-size="11" fill="#666" font-weight="bold" text-anchor="middle">FiLM Conditioning Inputs</text>

  <rect x="340" y="58" width="90" height="28" rx="4" fill="rgba(155,89,182,0.1)" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="385" y="76" font-size="9" fill="#333" font-weight="bold" text-anchor="middle">timestep t̂</text>

  <rect x="450" y="58" width="110" height="28" rx="4" fill="rgba(155,89,182,0.1)" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="505" y="76" font-size="9" fill="#333" font-weight="bold" text-anchor="middle">pooled text embed</text>

  <!-- Arrows down from FiLM inputs -->
  <line x1="385" y1="86" x2="385" y2="100" stroke="#9b59b6" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="505" y1="86" x2="505" y2="100" stroke="#9b59b6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="445" y="98" font-size="8" fill="#9b59b6" text-anchor="middle">→ all heads</text>

