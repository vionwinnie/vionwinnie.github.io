  <!-- Block indicators (small rects representing layers) -->
  <!-- Layers 1-4 (unhighlighted) -->
  <rect x="42" y="66" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
  <rect x="42" y="80" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
  <rect x="42" y="94" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
  <rect x="42" y="108" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>

  <!-- Layer 5 (HIGHLIGHTED - teal) -->
  <rect x="42" y="122" width="76" height="14" rx="2" fill="rgba(26,188,156,0.2)" stroke="#1abc9c" stroke-width="1.5"/>
  <text x="80" y="133" font-size="8" fill="#1abc9c" font-weight="bold" text-anchor="middle">Layer 5</text>

  <!-- Layers 6-9 -->
  <rect x="42" y="140" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
  <rect x="42" y="154" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
