  <text x="80" y="429" font-size="8" fill="#9b59b6" font-weight="bold" text-anchor="middle">Layer 25</text>

  <!-- Layers 26-28 -->
  <rect x="42" y="436" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
  <rect x="42" y="450" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>

  <!-- Layer 29 (HIGHLIGHTED - purple) -->
