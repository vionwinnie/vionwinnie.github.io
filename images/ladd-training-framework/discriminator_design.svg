  <rect x="42" y="302" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
  <rect x="42" y="316" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
  <rect x="42" y="330" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>

