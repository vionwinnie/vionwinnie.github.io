  <text x="80" y="207" font-size="8" fill="#1abc9c" font-weight="bold" text-anchor="middle">Layer 10</text>

  <!-- Layers 11-14 -->
  <rect x="42" y="214" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
  <rect x="42" y="228" width="76" height="10" rx="2" fill="rgba(230,126,34,0.08)" stroke="#e67e22" stroke-width="0.5"/>
