    <rect x="32" y="22" width="18" height="9" rx="1" fill="#ddd" fill-opacity="0.5"/>
    <rect x="32" y="32" width="18" height="9" rx="1" fill="#ddd" fill-opacity="0.5"/>
    <rect x="32" y="42" width="18" height="9" rx="1" fill="#ddd" fill-opacity="0.5"/>
    <rect x="32" y="52" width="18" height="9" rx="1" fill="#ddd" fill-opacity="0.5"/>
    <rect x="32" y="62" width="18" height="9" rx="1" fill="#ddd" fill-opacity="0.5"/>
