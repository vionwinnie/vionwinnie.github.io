    <!-- S2xT1 - heavy -->
    <rect x="12" y="22" width="18" height="9" rx="1" fill="#e74c3c" fill-opacity="0.6"/>
    <!-- S3xT1 -->
    <rect x="12" y="32" width="18" height="9" rx="1" fill="#e74c3c" fill-opacity="0.15"/>
