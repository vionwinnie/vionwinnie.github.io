<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 11px; font-weight: 700; }
      .prompt { font-size: 8.5px; fill: #555; font-style: italic; }
      .label { font-size: 8px; fill: #444; }
      .label-bold { font-size: 8px; fill: #333; font-weight: 600; }
      .result { font-size: 9px; font-weight: 600; }
      .caption { font-size: 7.5px; fill: #666; }
      .note { font-size: 7px; fill: #888; font-style: italic; }
      .matrix-label { font-size: 5.5px; fill: #666; }
      .axis-label { font-size: 5px; fill: #999; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="700" height="300" fill="#fafafa" rx="6"/>

  <!-- ============ LEFT PANEL: Keyword Matching ============ -->
