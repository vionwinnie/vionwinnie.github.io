    <!-- S6xT1 -->
    <rect x="12" y="62" width="18" height="9" rx="1" fill="#ddd" fill-opacity="0.5"/>
    <!-- S7xT1 -->
    <rect x="12" y="72" width="18" height="9" rx="1" fill="#ddd" fill-opacity="0.5"/>
    <!-- S8xT1 -->
