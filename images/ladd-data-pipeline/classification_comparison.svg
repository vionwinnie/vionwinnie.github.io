  <text x="78" y="78" text-anchor="middle" class="axis-label" fill="#c0392b" font-size="6.5">red dress</text>
  <rect x="100" y="68" width="30" height="14" rx="2" fill="#e74c3c" fill-opacity="0.12" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="115" y="78" text-anchor="middle" class="axis-label" fill="#c0392b" font-size="6.5">garden</text>
  <rect x="134" y="68" width="38" height="14" rx="2" fill="#e74c3c" fill-opacity="0.12" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="153" y="78" text-anchor="middle" class="axis-label" fill="#c0392b" font-size="6.5">wearing</text>

  <!-- Arrow to result -->
