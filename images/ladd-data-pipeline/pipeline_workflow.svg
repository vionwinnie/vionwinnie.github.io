<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="220" fill="#fafafa" rx="4"/>

  <!-- ===== STAGE 1: HARVEST ===== -->
  <text x="72" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#3498db">HARVEST</text>

  <rect x="8" y="24" width="128" height="112" rx="4" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="1"/>
  <text x="72" y="39" text-anchor="middle" font-size="9" font-weight="bold" fill="#2c3e50">9 Sources</text>
  <text x="72" y="51" text-anchor="middle" font-size="6" fill="#555">DiffusionDB  DataComp</text>
  <text x="72" y="59" text-anchor="middle" font-size="6" fill="#555">DenseFusion  ShareGPT4V</text>
  <text x="72" y="67" text-anchor="middle" font-size="6" fill="#555">JourneyDB  SAM-LLaVA</text>
  <text x="72" y="75" text-anchor="middle" font-size="6" fill="#555">Wukong  DOCCI</text>
  <text x="72" y="83" text-anchor="middle" font-size="6" fill="#555">Seed pool</text>
  <text x="72" y="100" text-anchor="middle" font-size="8" font-weight="bold" fill="#3498db">970K raw</text>

  <!-- Arrow Stage 1 -> 2 -->
  <line x1="140" y1="80" x2="156" y2="80" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== STAGE 2: MINHASH DEDUP ===== -->
  <text x="218" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#e67e22">MINHASH</text>

  <rect x="160" y="24" width="116" height="72" rx="4" fill="#e67e22" fill-opacity="0.12" stroke="#e67e22" stroke-width="1"/>
  <text x="218" y="42" text-anchor="middle" font-size="9" font-weight="bold" fill="#2c3e50">MinHash LSH</text>
  <text x="218" y="56" text-anchor="middle" font-size="7" fill="#777">Jaccard ≥ 0.7</text>
  <text x="218" y="72" text-anchor="middle" font-size="8" font-weight="bold" fill="#e67e22">→ 768K</text>
  <text x="218" y="84" text-anchor="middle" font-size="7" fill="#777">-21%</text>

  <!-- Arrow Stage 2 -> 3 -->
  <line x1="280" y1="80" x2="296" y2="80" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== STAGE 3: SEMANTIC DEDUP ===== -->
  <text x="358" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#e67e22">SEMANTIC</text>

  <rect x="300" y="24" width="116" height="72" rx="4" fill="#e67e22" fill-opacity="0.12" stroke="#e67e22" stroke-width="1"/>
  <text x="358" y="42" text-anchor="middle" font-size="9" font-weight="bold" fill="#2c3e50">FAISS Clustering</text>
  <text x="358" y="56" text-anchor="middle" font-size="7" fill="#777">cosine > 0.90</text>
  <text x="358" y="72" text-anchor="middle" font-size="8" font-weight="bold" fill="#e67e22">→ 630K</text>
  <text x="358" y="84" text-anchor="middle" font-size="7" fill="#777">-18%</text>

  <!-- Arrow Stage 3 -> 4 -->
  <line x1="420" y1="80" x2="436" y2="80" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== STAGE 4: CLASSIFY ===== -->
  <text x="500" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#9b59b6">CLASSIFY</text>

  <rect x="440" y="24" width="120" height="72" rx="4" fill="#9b59b6" fill-opacity="0.12" stroke="#9b59b6" stroke-width="1"/>
  <text x="500" y="42" text-anchor="middle" font-size="9" font-weight="bold" fill="#2c3e50">Hybrid Classifier</text>
  <text x="500" y="56" text-anchor="middle" font-size="7" fill="#777">keyword + zero-shot</text>
  <text x="500" y="68" text-anchor="middle" font-size="7" fill="#777">first-sentence strip</text>

  <!-- Arrow Stage 4 -> 5 -->
  <line x1="564" y1="80" x2="580" y2="80" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== STAGE 5: BALANCE ===== -->
  <text x="640" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#9b59b6">BALANCE</text>

  <rect x="584" y="24" width="112" height="72" rx="4" fill="#9b59b6" fill-opacity="0.12" stroke="#9b59b6" stroke-width="1"/>
  <text x="640" y="42" text-anchor="middle" font-size="8" font-weight="bold" fill="#2c3e50">Subject cap 15%</text>
  <text x="640" y="56" text-anchor="middle" font-size="7" fill="#777">Length filter</text>
  <text x="640" y="68" text-anchor="middle" font-size="7" fill="#777">Chinese ≥20 chars</text>

  <!-- Arrow Stage 5 -> Output -->
  <line x1="700" y1="80" x2="716" y2="80" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== STAGE 6: OUTPUT ===== -->
  <text x="768" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#27ae60">OUTPUT</text>

  <rect x="720" y="30" width="90" height="80" rx="4" fill="#27ae60" fill-opacity="0.12" stroke="#27ae60" stroke-width="1.5"/>
  <text x="765" y="52" text-anchor="middle" font-size="9" font-weight="bold" fill="#2c3e50">Final Dataset</text>
  <text x="765" y="68" text-anchor="middle" font-size="8" font-weight="bold" fill="#27ae60">630K prompts</text>
  <text x="765" y="82" text-anchor="middle" font-size="7" fill="#555">98 cells covered</text>

  <!-- ===== Stage divider lines ===== -->
  <line x1="148" y1="22" x2="148" y2="148" stroke="#ecf0f1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="288" y1="22" x2="288" y2="148" stroke="#ecf0f1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="428" y1="22" x2="428" y2="148" stroke="#ecf0f1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="572" y1="22" x2="572" y2="148" stroke="#ecf0f1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="708" y1="22" x2="708" y2="148" stroke="#ecf0f1" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ===== Bottom note ===== -->
  <rect x="140" y="160" width="540" height="22" rx="4" fill="#ecf0f1" fill-opacity="0.6"/>
  <text x="410" y="174" text-anchor="middle" font-size="8" fill="#7f8c8d" font-style="italic">Two-stage dedup removes 35% duplicates; hybrid classifier with caption first-sentence stripping</text>

</svg>