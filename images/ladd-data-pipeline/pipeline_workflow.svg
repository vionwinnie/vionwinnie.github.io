<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="280" fill="#fafafa" rx="4"/>

  <!-- ===== STAGE 1: COLLECTION ===== -->
  <text x="72" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#3498db">COLLECTION</text>

  <!-- 8 T2I Benchmarks -->
  <rect x="8" y="24" width="128" height="72" rx="4" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="1"/>
  <text x="72" y="39" text-anchor="middle" font-size="9" font-weight="bold" fill="#2c3e50">8 T2I Benchmarks</text>
  <text x="72" y="51" text-anchor="middle" font-size="6" fill="#555">PartiPrompts  GenAI-Bench</text>
  <text x="72" y="59" text-anchor="middle" font-size="6" fill="#555">DPG-Bench  CVTG-2K</text>
  <text x="72" y="67" text-anchor="middle" font-size="6" fill="#555">OneIG-ZH  GenEval</text>
  <text x="72" y="75" text-anchor="middle" font-size="6" fill="#555">LongText-Bench  DrawBench</text>

  <!-- MJHQ-30K -->
  <rect x="8" y="102" width="128" height="28" rx="4" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="1"/>
  <text x="72" y="119" text-anchor="middle" font-size="9" font-weight="bold" fill="#2c3e50">MJHQ-30K</text>
  <text x="72" y="128" text-anchor="middle" font-size="6" fill="#777">(Midjourney curated)</text>

  <!-- SDXL-1M Rejected -->
  <rect x="8" y="136" width="128" height="28" rx="4" fill="#e74c3c" fill-opacity="0.08" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="72" y="153" text-anchor="middle" font-size="9" fill="#bdc3c7" text-decoration="line-through">SDXL-1M</text>
  <line x1="30" y1="145" x2="114" y2="157" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="108" y="143" font-size="6.5" fill="#e74c3c" font-weight="bold">Rejected</text>

  <!-- Arrow Stage 1 -> 2 -->
  <line x1="140" y1="80" x2="156" y2="80" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== STAGE 2: CLASSIFICATION ===== -->
  <text x="218" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#e67e22">CLASSIFICATION</text>

  <!-- Keyword Matcher (crossed out) -->
  <rect x="160" y="30" width="116" height="28" rx="4" fill="#e67e22" fill-opacity="0.08" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="218" y="48" text-anchor="middle" font-size="8" fill="#bdc3c7" text-decoration="line-through">Keyword Matcher</text>
  <line x1="172" y1="38" x2="264" y2="52" stroke="#e74c3c" stroke-width="1.2"/>

  <!-- Arrow down -->
  <line x1="218" y1="60" x2="218" y2="70" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Claude Reclassification -->
  <rect x="160" y="72" width="116" height="32" rx="4" fill="#e67e22" fill-opacity="0.12" stroke="#e67e22" stroke-width="1"/>
  <text x="218" y="87" text-anchor="middle" font-size="8" font-weight="bold" fill="#2c3e50">Claude Reclassification</text>
  <text x="218" y="98" text-anchor="middle" font-size="7" fill="#777">4 parallel agents</text>

  <!-- Output taxonomy -->
  <rect x="160" y="112" width="116" height="22" rx="4" fill="#e67e22" fill-opacity="0.06" stroke="#e67e22" stroke-width="0.8"/>
  <text x="218" y="126" text-anchor="middle" font-size="7" fill="#2c3e50">14 Subj x 7 Styles x 8 Cam</text>

  <!-- Arrow Stage 2 -> 3 -->
  <line x1="280" y1="80" x2="296" y2="80" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== STAGE 3: GAP FILL ===== -->
  <text x="364" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#27ae60">GAP FILL</text>

  <!-- Gap Analysis -->
  <rect x="300" y="30" width="128" height="28" rx="4" fill="#27ae60" fill-opacity="0.12" stroke="#27ae60" stroke-width="1"/>
  <text x="364" y="44" text-anchor="middle" font-size="8" font-weight="bold" fill="#2c3e50">Gap Analysis</text>
  <text x="364" y="54" text-anchor="middle" font-size="7" fill="#777">80/98 cells &lt; 50</text>

  <!-- Arrow down -->
  <line x1="364" y1="60" x2="364" y2="70" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Generate prompts -->
  <rect x="300" y="72" width="128" height="24" rx="4" fill="#27ae60" fill-opacity="0.12" stroke="#27ae60" stroke-width="1"/>
  <text x="364" y="87" text-anchor="middle" font-size="8" font-weight="bold" fill="#2c3e50">Generate 3,347 prompts</text>

  <!-- Arrow down -->
  <line x1="364" y1="98" x2="364" y2="108" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Expand -->
  <rect x="300" y="110" width="128" height="24" rx="4" fill="#27ae60" fill-opacity="0.12" stroke="#27ae60" stroke-width="1"/>
  <text x="364" y="125" text-anchor="middle" font-size="8" font-weight="bold" fill="#2c3e50">Expand to 30-40 words</text>

  <!-- Arrow Stage 3 -> 4 -->
  <line x1="432" y1="80" x2="448" y2="80" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== STAGE 4: BALANCE ===== -->
  <text x="512" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#9b59b6">BALANCE</text>

  <!-- Length Filter -->
  <rect x="452" y="30" width="120" height="24" rx="4" fill="#9b59b6" fill-opacity="0.12" stroke="#9b59b6" stroke-width="1"/>
  <text x="512" y="44" text-anchor="middle" font-size="8" font-weight="bold" fill="#2c3e50">Length Filter</text>
  <text x="512" y="52" text-anchor="middle" font-size="7" fill="#777">10-80 words</text>

  <!-- Arrow down -->
  <line x1="512" y1="56" x2="512" y2="66" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Stratified Resample -->
  <rect x="452" y="68" width="120" height="28" rx="4" fill="#9b59b6" fill-opacity="0.12" stroke="#9b59b6" stroke-width="1"/>
  <text x="512" y="82" text-anchor="middle" font-size="8" font-weight="bold" fill="#2c3e50">Stratified Resample</text>
  <text x="512" y="92" text-anchor="middle" font-size="7" fill="#777">min 30/cell</text>

  <!-- Arrow down -->
  <line x1="512" y1="98" x2="512" y2="108" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- MJHQ Fill -->
  <rect x="452" y="110" width="120" height="24" rx="4" fill="#9b59b6" fill-opacity="0.12" stroke="#9b59b6" stroke-width="1"/>
  <text x="512" y="124" text-anchor="middle" font-size="8" font-weight="bold" fill="#2c3e50">MJHQ Fill</text>
  <text x="512" y="132" text-anchor="middle" font-size="7" fill="#777">25-50 word range</text>

  <!-- Arrow Stage 4 -> Output -->
  <line x1="576" y1="80" x2="592" y2="80" stroke="#7f8c8d" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== OUTPUT ===== -->
  <text x="646" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#27ae60">OUTPUT</text>

  <rect x="596" y="40" width="96" height="80" rx="4" fill="#27ae60" fill-opacity="0.12" stroke="#27ae60" stroke-width="1.5"/>
  <text x="644" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#2c3e50">Final Dataset</text>
  <text x="644" y="78" text-anchor="middle" font-size="7" fill="#555">~12K prompts</text>
  <text x="644" y="90" text-anchor="middle" font-size="7" fill="#555">mean 35 words</text>
  <text x="644" y="102" text-anchor="middle" font-size="7" fill="#555">98 cells covered</text>

  <!-- ===== Stage divider lines ===== -->
  <line x1="144" y1="22" x2="144" y2="170" stroke="#ecf0f1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="286" y1="22" x2="286" y2="170" stroke="#ecf0f1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="438" y1="22" x2="438" y2="170" stroke="#ecf0f1" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="582" y1="22" x2="582" y2="170" stroke="#ecf0f1" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ===== Bottom note ===== -->
  <rect x="80" y="182" width="540" height="22" rx="4" fill="#ecf0f1" fill-opacity="0.6"/>
  <text x="350" y="196" text-anchor="middle" font-size="8" fill="#7f8c8d" font-style="italic">Coverage-aware balancing preserves MECE taxonomy while shaping length distribution</text>

</svg>