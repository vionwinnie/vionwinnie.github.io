<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="320" rx="10" fill="#f8f9fa"/>

  <!-- LEFT PANEL: Before Balancing -->
  <rect x="12" y="10" width="330" height="170" rx="8" fill="#fff" filter="url(#shadow)" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="177" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">Before Balancing</text>

  <!-- Left axis line -->
  <line x1="55" y1="42" x2="55" y2="135" stroke="#bbb" stroke-width="0.8"/>
  <line x1="55" y1="135" x2="310" y2="135" stroke="#bbb" stroke-width="0.8"/>

  <!-- Y-axis labels -->
  <text x="50" y="50" text-anchor="end" font-size="7" fill="#999">44%</text>
  <text x="50" y="75" text-anchor="end" font-size="7" fill="#999">28%</text>
  <text x="50" y="100" text-anchor="end" font-size="7" fill="#999">14%</text>
  <text x="50" y="135" text-anchor="end" font-size="7" fill="#999">0%</text>

  <!-- Left histogram bars (bimodal: spike at 10-20) -->
  <!-- 10-20 words: 44% -->
  <rect x="62" y="46" width="38" height="89" rx="3" fill="#e74c3c" opacity="0.75"/>
  <!-- 20-30 words: 14% -->
  <rect x="108" y="105" width="38" height="30" rx="3" fill="#e74c3c" opacity="0.6"/>
  <!-- 30-40 words: 8% -->
  <rect x="154" y="117" width="38" height="18" rx="3" fill="#e74c3c" opacity="0.5"/>
  <!-- 40-50 words: 6% -->
  <rect x="200" y="121" width="38" height="14" rx="3" fill="#e74c3c" opacity="0.45"/>
  <!-- 50-75 words: 18% (DPG bump) -->
  <rect x="246" y="96" width="50" height="39" rx="3" fill="#e74c3c" opacity="0.65"/>

  <!-- X-axis labels -->
  <text x="81" y="145" text-anchor="middle" font-size="7" fill="#888">10-20</text>
  <text x="127" y="145" text-anchor="middle" font-size="7" fill="#888">20-30</text>
  <text x="173" y="145" text-anchor="middle" font-size="7" fill="#888">30-40</text>
  <text x="219" y="145" text-anchor="middle" font-size="7" fill="#888">40-50</text>
  <text x="271" y="145" text-anchor="middle" font-size="7" fill="#888">50-75</text>
  <text x="177" y="155" text-anchor="middle" font-size="7" fill="#aaa">word count</text>

  <!-- DPG-Bench label -->
  <text x="271" y="91" text-anchor="middle" font-size="6.5" fill="#c0392b" font-style="italic">DPG-Bench</text>

  <!-- Stats -->
  <text x="177" y="167" text-anchor="middle" font-size="8" font-weight="600" fill="#555">Mean: 27, Median: 16</text>
  <text x="177" y="177" text-anchor="middle" font-size="7.5" fill="#e74c3c" font-style="italic">Bimodal -- too many short prompts</text>

  <!-- RIGHT PANEL: After Balancing -->
  <rect x="358" y="10" width="330" height="170" rx="8" fill="#fff" filter="url(#shadow)" stroke="#27ae60" stroke-width="1.5"/>
  <text x="523" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#1e8449">After Balancing</text>

  <!-- Right axis line -->
  <line x1="401" y1="42" x2="401" y2="135" stroke="#bbb" stroke-width="0.8"/>
  <line x1="401" y1="135" x2="656" y2="135" stroke="#bbb" stroke-width="0.8"/>

  <!-- Y-axis labels -->
  <text x="396" y="55" text-anchor="end" font-size="7" fill="#999">32%</text>
  <text x="396" y="80" text-anchor="end" font-size="7" fill="#999">20%</text>
  <text x="396" y="105" text-anchor="end" font-size="7" fill="#999">10%</text>
  <text x="396" y="135" text-anchor="end" font-size="7" fill="#999">0%</text>

  <!-- Right histogram bars (bell-shaped, peak at 25-35) -->
  <!-- 10-20 words: 10% -->
  <rect x="408" y="109" width="38" height="26" rx="3" fill="#27ae60" opacity="0.5"/>
  <!-- 20-30 words: 26% -->
  <rect x="454" y="65" width="38" height="70" rx="3" fill="#27ae60" opacity="0.7"/>
  <!-- 25-35 words: 32% (peak) -->
  <rect x="500" y="48" width="38" height="87" rx="3" fill="#27ae60" opacity="0.8"/>
  <!-- 35-50 words: 20% -->
  <rect x="546" y="78" width="38" height="57" rx="3" fill="#27ae60" opacity="0.65"/>
  <!-- 50+ words: 12% -->
  <rect x="592" y="103" width="38" height="32" rx="3" fill="#27ae60" opacity="0.5"/>

  <!-- X-axis labels -->
  <text x="427" y="145" text-anchor="middle" font-size="7" fill="#888">10-20</text>
  <text x="473" y="145" text-anchor="middle" font-size="7" fill="#888">20-30</text>
  <text x="519" y="145" text-anchor="middle" font-size="7" fill="#888">30-40</text>
  <text x="565" y="145" text-anchor="middle" font-size="7" fill="#888">40-50</text>
  <text x="611" y="145" text-anchor="middle" font-size="7" fill="#888">50+</text>
  <text x="523" y="155" text-anchor="middle" font-size="7" fill="#aaa">word count</text>

  <!-- Stats -->
  <text x="523" y="167" text-anchor="middle" font-size="8" font-weight="600" fill="#555">Mean: 35, Median: 32</text>
  <text x="523" y="177" text-anchor="middle" font-size="7.5" fill="#1e8449" font-style="italic">Bell-shaped -- centered at target</text>

  <!-- Arrow between panels -->
  <line x1="344" y1="95" x2="356" y2="95" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#888"/>
    </marker>
  </defs>

  <!-- BOTTOM SECTION: 3-step strategy -->
  <rect x="12" y="190" width="676" height="55" rx="8" fill="#fff" filter="url(#shadow)" stroke="#3498db" stroke-width="1"/>
  <text x="350" y="206" text-anchor="middle" font-size="9" font-weight="700" fill="#2c3e50">3-Step Balancing Strategy</text>

  <!-- Step 1: Filter -->
  <rect x="24" y="213" width="210" height="26" rx="5" fill="#ebf5fb"/>
  <!-- Filter icon -->
  <g transform="translate(32, 218)">
    <polygon points="0,0 14,0 9,9 9,16 5,16 5,9" fill="none" stroke="#3498db" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <text x="52" y="225" font-size="8" font-weight="600" fill="#2c3e50">1.</text>
  <text x="62" y="225" font-size="8" fill="#2c3e50">Hard cutoffs: 10-80 words</text>
  <text x="62" y="234" font-size="6.5" fill="#7f8c8d">Remove extreme outliers</text>

  <!-- Step 2: Grid -->
  <rect x="245" y="213" width="210" height="26" rx="5" fill="#ebf5fb"/>
  <!-- Grid icon -->
  <g transform="translate(253, 218)">
    <rect x="0" y="0" width="6" height="6" fill="none" stroke="#3498db" stroke-width="1"/>
    <rect x="7" y="0" width="6" height="6" fill="none" stroke="#3498db" stroke-width="1"/>
    <rect x="0" y="7" width="6" height="6" fill="none" stroke="#3498db" stroke-width="1"/>
    <rect x="7" y="7" width="6" height="6" fill="none" stroke="#3498db" stroke-width="1"/>
  </g>
  <text x="273" y="225" font-size="8" font-weight="600" fill="#2c3e50">2.</text>
  <text x="283" y="225" font-size="8" fill="#2c3e50">Per-cell stratified keep: min 30/cell</text>
  <text x="283" y="234" font-size="6.5" fill="#7f8c8d">Preserve rare category combos</text>

  <!-- Step 3: Add -->
  <rect x="466" y="213" width="210" height="26" rx="5" fill="#ebf5fb"/>
  <!-- Add/plus icon -->
  <g transform="translate(474, 218)">
    <circle cx="7" cy="7" r="7" fill="none" stroke="#3498db" stroke-width="1.2"/>
    <line x1="7" y1="3" x2="7" y2="11" stroke="#3498db" stroke-width="1.5"/>
    <line x1="3" y1="7" x2="11" y2="7" stroke="#3498db" stroke-width="1.5"/>
  </g>
  <text x="494" y="225" font-size="8" font-weight="600" fill="#2c3e50">3.</text>
  <text x="504" y="225" font-size="8" fill="#2c3e50">MJHQ mid-range fill: 25-50 words</text>
  <text x="504" y="234" font-size="6.5" fill="#7f8c8d">Boost underrepresented range</text>

  <!-- Bottom note -->
  <rect x="12" y="254" width="676" height="22" rx="6" fill="#eef6f0"/>
  <text x="350" y="268" text-anchor="middle" font-size="7.5" fill="#555" font-style="italic">Stratified resampling shifts distribution without destroying sparse category cells</text>

  <!-- Connecting arrows between steps -->
  <line x1="236" y1="226" x2="243" y2="226" stroke="#3498db" stroke-width="1" marker-end="url(#bluearrow)"/>
  <line x1="457" y1="226" x2="464" y2="226" stroke="#3498db" stroke-width="1" marker-end="url(#bluearrow)"/>
  <defs>
    <marker id="bluearrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#3498db"/>
    </marker>
  </defs>
</svg>